class Corpse {
  constructor(e) {
    this.x = e.x; this.y = e.y; this.vx = e.vx * 0.4 + rnd(-40, 40); this.vy = -rnd(120, 230);
    this.rot = 0; this.vr = rnd(-9, 9);
    this.pal = e.pal; this.t = 0; this.rot2 = 0; this.dead = false; this.fade = 1;
    this.spr = null; this.type = e.type;
    this.landed = false;
  }
  update(dt, w) {
    this.t += dt;
    if (this.landed) { this.fade = Math.max(0, 1 - (this.t - 0.6) / 2.5); if (this.fade <= 0) this.dead = true; return; }
    this.vy += 1000 * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.vr * dt;
    if (w.solidAt(this.x, this.y + 6)) {
      this.y = Math.floor(this.y + 6) - 6;
      this.landed = true; this.rot = Math.round(this.rot / (Math.PI / 2)) * (Math.PI / 2);
      FX.dust(this.x, this.y + 6, 3, 'rgba(140,120,100,0.5)');
    }
    if (this.t > 6) this.dead = true;
  }
  draw(c, camX, camY) {
    c.save();
    c.globalAlpha = this.fade;
    c.translate(Math.round(this.x - camX), Math.round(this.y - camY));
    c.rotate(this.rot);
    const spr = this.spr || (this.spr = fighterFrame(this.pal, 'dead', 3, 'none', {}));
    c.drawImage(spr, -spr.width / 2, -spr.height + 4);
    c.restore();
  }
}

class Enemy {
  constructor(type, x, y, entrance) {
    const d = ETYPE[type];
    this.type = type; this.def = d;
    this.x = x; this.y = y; this.w = d.w; this.h = d.h;
    this.vx = 0; this.vy = 0; this.face = -1;
    this.hp = d.hp; this.maxHp = d.hp;
    this.onGround = false;
    this.state = 'idle'; this.t = rnd(0, 1);
    this.anim = 'idle'; this.frame = 0; this.animT = rnd(0, 3);
    this.fireT = rnd(0.4, 1.6); this.grenadeT = rnd(3, 7);
    this.flash = 0; this.stun = 0; this.panic = 0; this.dead = false;
    this.aim = 0; this.shootAnim = 0; this.alert = 0;
    this.entrance = entrance || 'ground';
    this.dropT = 0; this.marked = false;
    this.scale = 1;
    this.homeY = y;
    this.orbit = rnd(0, TAU);
    this.spawnT = 0; this.atkT = 0; this.burst = 0; this.burstT = 0;
    if (d.fly) { this.vx = (chance(0.5) ? 1 : -1) * d.speed; this.y = y; }
    this.applyEntrance();
  }
  applyEntrance() {
    switch (this.entrance) {
      case 'drop': this.y -= 90; this.vy = 40; this.dropT = 0.5; break;
      case 'burst':
        FX.explosion(this.x, this.y + this.h / 2, 0.7);
        FX.shake(3);
        this.vx = rnd(-40, 40);
        break;
      case 'window': this.vy = -40; this.vx = 40; this.spawnT = 0.4; break;
      case 'truck': this.x -= 60; this.vx = 120; this.spawnT = 0.5; break;
    }
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  hurt(dmg, w, srcX, opts) {
    if (this.dead) return;
    opts = opts || {};
    const armored = this.type === 'heavy' || this.type === 'emplacement';
    if (armored && (!opts.pierce)) {
      dmg = dmg * 0.45;
      SFX('hitArmor');
      FX.hit(srcX !== undefined ? srcX : this.cx, this.cy, '#c0c0d0', 5);
    } else {
      SFX('hit', { pitch: rnd(0.9, 1.25) });
      FX.hit(this.cx, this.cy, this.def.barrel ? '#f08020' : '#ffd060', 5);
    }
    this.alert = 1;
    this.hp -= dmg;
    this.flash = 1;
    this.stun = Math.max(this.stun, 0.08);
    if (srcX !== undefined) {
      const k = sign(this.cx - srcX);
      this.vx += k * (armored ? 14 : 60);
      this.hurtDir = k;
    }
    if (this.hp <= this.maxHp * 0.4 && this.def.pal && chance(0.3)) this.panic = rnd(2, 4);
    if (this.hp <= 0) this.die(w, srcX);
  }
  die(w, srcX) {
    if (this.dead) return;
    this.dead = true;
    if(this.postId!==undefined)w.defeatedPosts.add(this.postId);
    if(this.laser)this.laser.dead=true;
    const s = this.def.score;
    w.addScore(s, this.cx, this.cy);
    if (this.def.barrel) {
      FX.fireball(this.cx, this.cy, 1.1);
      FX.explosion(this.cx, this.cy, 1.1);
      SFX('explode');
      w.explodeDamage(this.cx, this.cy, 60, 56, 'p');
      this.wave = 1; this.dead = true;
      return;
    }
    SFX(this.type === 'drone' || this.type === 'jeep' ? 'explode' : 'enemyDie', { v: 0.9 });
    if (chance(0.4)) SFX('scream', { v: 0.5 });
    if(!this.def.fly && !this.def.static && this.type !== 'jeep') w.corpses.push(new Corpse(this));
    FX.blood(this.cx, this.cy, this.def.pal === 'heavy' ? '#c0b040' : '#c03a3a', 7);
    if (this.type === 'drone' || this.type === 'jeep' || this.type === 'copter') {
      FX.fireball(this.cx, this.cy, 1.2);
      FX.explosion(this.cx, this.cy, 1.2);
      w.explodeDamage(this.cx, this.cy, 40, 48, 'p');
    } else if (chance(0.35)) {
      emit({ x: this.cx, y: this.cy, life: 0.6, kind: 'flash', col: 'rgba(255,240,200,0.8)', size: 8 });
    }
    // chance to drop ammo
    if (chance(0.16)) w.spawnPickup(this.cx, this.cy, 'ammo');
  }

  /* -------- AI -------- */
  update(dt, w) {
    if (this.dead) return;
    if(this.postId!==undefined && (this.x>w.camX+VW+64 || this.x+this.w<w.camX-64)){this.vx=0;return;}
    this.t += dt; this.animT += dt;
    this.flash = Math.max(0, this.flash - dt * 5);
    this.stun = Math.max(0, this.stun - dt);
    this.panic = Math.max(0, this.panic - dt);
    this.shootAnim = Math.max(0, this.shootAnim - dt);
    this.spawnT = Math.max(0, this.spawnT - dt);
    if (this.dropT > 0) { this.dropT -= dt; }
    const p = w.player;
    const px = p.cx, py = p.cy;
    const dx = px - this.cx, dy = py - this.cy;
    const dist = Math.hypot(dx, dy);
    this.aim = Math.atan2(dy, dx);

    // aggro
    if (dist < (this.def.static ? 260 : 250) && p.state === 'normal') this.alert = 1;

    if (p.state !== 'normal' || this.spawnT > 0 || this.stun > 0) {
      this.vx = 0;
      if (!this.def.fly) this.physics(dt,w,p);
      this.updateAnim(); return;
    }
    switch (this.type) {
      case 'soldier': case 'soldier2': this.aiSoldier(dt, w, p, dx, dist); break;
      case 'rusher': this.aiRusher(dt, w, p, dx, dist); break;
      case 'sniper': this.aiSniper(dt, w, p, dx, dist); break;
      case 'heavy': this.aiHeavy(dt, w, p, dx, dist); break;
      case 'drone': this.aiDrone(dt, w, p, dx, dy, dist); break;
      case 'copter': this.aiCopter(dt, w, p, dx, dy, dist); break;
      case 'turret': this.aiTurret(dt, w, p, dx, dist, 'ebolt'); break;
      case 'emplacement': this.aiTurret(dt, w, p, dx, dist, 'spread'); break;
      case 'barrelman': this.aiBarrelman(dt, w, p, dx, dist); break;
      case 'barrel': this.vx = 0; break;
      case 'jeep': this.aiJeep(dt, w, p); break;
    }

    if (!this.def.fly) this.physics(dt, w, p);
    else if (this.def.fly) this.flyPhysics(dt, w, p);

    this.updateAnim();
  }

  physics(dt, w, p) {
    this.vy += 1500 * dt;
    this.vy = Math.min(this.vy, 700);
    const sp = this.def.speed;
    if (this.stun > 0) { this.vx *= Math.pow(0.02, dt); }
    else this.vx = clamp(this.vx, -sp, this.panic > 0 ? sp * 1.35 : sp);
    if(this.onGround && this.vx && this.type !== 'rusher' && this.type !== 'barrelman' && this.type !== 'jeep'){
      const ahead=this.vx>0?this.x+this.w+2:this.x-2;
      const ground=w.groundBelow(ahead,this.feet);
      if(ground===null||ground-this.feet>TILE)this.vx=0;
    }
    Player.prototype.moveX.call(this, this.vx * dt, w);
    Player.prototype.moveY.call(this, this.vy * dt, w);
    // fall off world
    if (this.y > Level.H * TILE + 60) this.dead = true;
  }
  get feet() { return this.y + this.h; }
  clampToWorld() { if (this.y > Level.H * TILE + 60) this.dead = true; }
  flyPhysics(dt, w, p) {
    // Flight is velocity-controlled; gravity would drag the drone into the terrain.
    const nx=this.x+this.vx*dt,ny=this.y+this.vy*dt;
    if(!w.anySolid(nx,this.y,nx+this.w,this.y+this.h))this.x=nx;else this.vx*=-0.5;
    if(!w.anySolid(this.x,ny,this.x+this.w,ny+this.h))this.y=ny;else this.vy=0;
    this.x=clamp(this.x,0,Level.W*TILE-this.w);
  }

  shootAt(w, p, kind, speed, dmg, spread, life) {
    if(!w.canEnemyAttack(this))return;
    const o = { x: this.cx + Math.cos(this.aim) * 8, y: this.cy + Math.sin(this.aim) * 6 - 2, own: 'e' };
    let a = this.aim + rnd(-(spread || 0), (spread || 0));
    w.bullets.push(new Bullet({
      x: o.x, y: o.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      dmg: dmg || 8, life: life || 1.6, own: 'e', kind: kind || 'pistol', r: 2,
    }));
    FX.muzzle(o.x, o.y, a, false);
    this.shootAnim = 0.14;
  }

  aiSoldier(dt, w, p, dx, dist) {
    if (this.alert && this.stun <= 0) {
      const dir = sign(dx) || 1;
      this.face = dir;
      this.fireT -= dt;
      this.grenadeT -= dt;
      if (this.panic > 0) {
        this.anim = 'panic';
        this.vx = -dir * this.def.speed * 1.25;
        this.wantsWalk = true;
        if (chance(0.01)) SFX('scream', { v: 0.5 });
      } else if (Math.abs(p.y - this.y) < 26) {
        if (dist > 130) { this.vx = dir * this.def.speed; this.wantsWalk = true; }
        else if (dist < 60) { this.vx = -dir * this.def.speed * 0.7; this.wantsWalk = true; }
        else { this.vx = 0; this.wantsWalk = false; }
        // shoot
        if (this.fireT <= 0 && Math.abs(dx) < 200) {
          this.fireT = rnd(0.7, 1.6);
          this.burst = 3;
        }
        if (this.burst > 0) {
          this.burstT = (this.burstT || 0) - dt;
          if (this.burstT <= 0) {
            this.burstT = 0.12;
            this.burst--;
            this.shootAt(w, p, 'pistol', 150 + dist * 0.35, 8, 0.09, 1.8);
            SFX('pistol', { v: 0.45, pitch: 0.8 });
          }
        }
        if (w.canEnemyAttack(this) && this.grenadeT <= 0 && dist > 90 && dist < 220 && this.onGround) {
          this.grenadeT = rnd(6, 12);
          this.throwT = 0.4;
          w.grenades.push(new Grenade(this.cx, this.y + 4, dir * 190, -180, 'e', 1.6));
          SFX('thrown', { v: 0.6 });
        }
      } else {
        // vertical difference: jump or find stairs
        if (p.y < this.y - 24 && this.onGround && Math.abs(dx) < 30 && chance(0.02)) { this.vy = -260; }
        this.vx = dist > 60 ? dir * this.def.speed * 0.6 : 0;
        this.wantsWalk = true;
      }
    } else {
      this.vx *= 0.9;
      this.anim = 'idle';
    }
  }

  aiRusher(dt, w, p, dx, dist) {
    if (!this.alert || this.stun > 0) { this.vx *= 0.9; return; }
    const dir = sign(dx) || 1;
    this.face = dir;
    this.vx = dir * this.def.speed;
    this.wantsWalk = true;
    if (chance(dt * 3)) SFX('grunt', { v: 0.5 });
    if (Math.abs(p.y - this.y) > 20 && this.onGround) { this.vy = -280; }
    if (dist < 20 && this.atkT <= 0 && w.canEnemyAttack(this)) {
      this.atkT = 0.8;
      SFX('knife');
      FX.hit(p.cx - dir * 4, p.cy, '#ffffff', 6);
      p.damage(1, w, this.cx);
      this.vx = -dir * 60;
    }
    this.atkT = Math.max(0, (this.atkT || 0) - dt);
  }

  aiSniper(dt,w,p,dx,dist) {
    this.vx=0;this.face=sign(dx)||this.face;this.anim='crouch';
    if(!this.alert||!w.canEnemyAttack(this)||dist>400)return;
    this.fireT-=dt;
    if(this.laser && this.laser.dead)this.laser=null;
    if(!this.laser && this.fireT<=0){
      this.laser=new LaserLine(this.cx,this.cy-2,this.aim,1.1);
      this.laser.owner=this;
      w.lasers.push(this.laser);
      this.fireT=2.8;
    }
  }

  aiHeavy(dt, w, p, dx, dist) {
    if (!this.alert || this.stun > 0) { this.vx *= 0.85; return; }
    const dir = sign(dx) || 1;
    this.face = dir;
    this.wantsWalk = true;
    if (dist > 120) this.vx = dir * this.def.speed;
    else this.vx = dist < 60 ? -dir * this.def.speed * 0.6 : 0;
    this.fireT -= dt;
    if (this.fireT <= 0 && dist < 240) {
      this.fireT = rnd(1.2, 2.2);
      this.burst = 4;
    }
    if (this.burst > 0) {
      this.burstT = (this.burstT || 0) - dt;
      if (this.burstT <= 0) {
        this.burstT = 0.14; this.burst--;
        this.shootAt(w, p, 'ebolt', 200, 12, 0.05, 2.2);
        SFX('ebolt', { v: 0.5 });
      }
    }
  }

  aiDrone(dt, w, p, dx, dy, dist) {
    // hold station above the player and circle, rather than drifting off-screen
    const targetY = p.y - 46 + Math.sin(this.t * 1.6 + this.orbit) * 16;
    this.vy = clamp((targetY - this.y) * 2.6, -100, 100);
    const dir = sign(dx) || 1;
    if (Math.abs(dx) > 54) this.vx = clamp(this.vx + dir * 130 * dt, -this.def.speed, this.def.speed);
    else this.vx = clamp(this.vx * Math.pow(0.25, dt), -34, 34);
    this.face = this.vx > 0 ? 1 : -1;
    // never let a flyer wander outside the visible field
    const lo = w.camX + this.w, hi = w.camX + VW - this.w;
    if (this.x < lo) { this.x = lo; this.vx = Math.abs(this.vx); }
    if (this.x > hi) { this.x = hi; this.vx = -Math.abs(this.vx); }
    this.bombT = (this.bombT || rnd(1.5, 3.5)) - dt;
    if (this.bombT <= 0 && this.alert && w.canEnemyAttack(this)) {
      this.bombT = rnd(2.2, 4);
      w.bullets.push(new Bullet({
        x: this.cx, y: this.y + 8, vx: rnd(-14, 14), vy: 60, dmg: 14, life: 4, own: 'e',
        kind: 'grenade', grav: 260, explode: 0.6, r: 3, selfSafe: true,
      }));
      SFX('thrown', { v: 0.4 });
    }
  }

  aiCopter(dt, w, p, dx, dy, dist) {
    const targetY = p.y - 78;
    this.vy = clamp((targetY - this.y) * 2, -60, 60);
    if (this.x < w.camX + 20) this.vx = Math.abs(this.vx) || 60;
    if (this.x > w.camX + VW - 20) this.vx = -Math.abs(this.vx) || -60;
    this.face = this.vx > 0 ? 1 : -1;
    this.bombT = (this.bombT || 1.5) - dt;
    if (this.bombT <= 0 && w.canEnemyAttack(this)) {
      this.bombT = rnd(1.2, 2.2);
      w.bullets.push(new Bullet({ x: this.x + 10, y: this.y + 16, vx: rnd(-8, 8), vy: 70, dmg: 16, life: 5, own: 'e', kind: 'grenade', grav: 240, explode: 0.7, r: 3 }));
      SFX('thrown', { v: 0.4 });
    }
    if (chance(0.4)) FX.smokeTrail(this.x + 6, this.y + 2, 'rgba(100,100,110,0.4)', 1.6);
  }

  aiTurret(dt, w, p, dx, dist, kind) {
    if (!this.alert) { this.anim = 'idle'; return; }
    this.face = sign(dx) || this.face;
    this.anim = 'idle';
    this.fireT -= dt;
    if (this.fireT <= 0 && dist < 250) {
      this.fireT = kind === 'ebolt' ? rnd(1.1, 1.9) : rnd(0.9, 1.5);
      this.burst = kind === 'ebolt' ? 1 : 3;
    }
    if (this.burst > 0) {
      this.burstT = (this.burstT || 0) - dt;
      if (this.burstT <= 0) {
        this.burstT = 0.16; this.burst--;
        this.shootAt(w, p, kind, kind === 'ebolt' ? 165 : 210, kind === 'ebolt' ? 11 : 8, kind === 'ebolt' ? 0.03 : 0.16, 2.4);
        SFX(kind === 'ebolt' ? 'ebolt' : 'shotgun', { v: 0.5 });
      }
    }
  }

  aiBarrelman(dt, w, p, dx, dist) {
    if (!this.alert) { this.vx *= 0.9; return; }
    const dir = sign(dx) || 1;
    this.face = dir;
    this.vx = dir * this.def.speed;
    this.wantsWalk = true;
    if(dist<56 && this.fuseT===undefined)this.fuseT=1.1;
    if(this.fuseT!==undefined){this.fuseT-=dt;this.vx=0;}
    if (this.fuseT < 0.8 && (G.time * 8 | 0) % 2) { /* blink */ }
    if (chance(dt * 4)) SFX('grunt', { v: 0.6, pitch: 1.4 });
    if (this.fuseT !== undefined && this.fuseT <= 0) {
      FX.fireball(this.cx, this.cy, 1.35);
      FX.explosion(this.cx, this.cy, 1.35);
      SFX('explodeBig');
      w.explodeDamage(this.cx, this.cy, 50, 62, 'e');
      this.dead = true;
      w.addScore(50, this.cx, this.cy);
      if (chance(0.5)) SFX('scream', { v: 0.6 });
    }
  }

  aiJeep(dt, w, p) {
    this.vx = this.face * this.def.speed;
    this.y += 0;
    // drive over ground
    const gy = w.groundBelow(this.cx, this.y + this.h);
    if (gy !== null && this.y + this.h >= gy) { this.y = gy - this.h; this.vy = 0; this.bump = (this.bump || 0) + dt; }
    else if (gy === null || this.y + this.h < gy - 20) { /* airborne */ }
    // crush / run over
    if (p.state === 'normal' && aabb(this, p) && p.state !== 'invincible') {
      this.crushT = (this.crushT || 0) - dt;
      if (this.crushT <= 0) { p.damage(2, w, this.cx); this.crushT = 0.8; FX.shake(4); }
    }
    // destroy obstacles
    for (const e of w.enemies) {
      if (e === this || e.dead) continue;
      if (e.def.static && aabb({ x: this.x, y: this.y, w: this.w, h: this.h - 6 }, e)) e.hurt(99, w, this.cx);
    }
    this.fireT -= dt;
    if (this.fireT <= 0 && w.canEnemyAttack(this)) {
      this.fireT = rnd(0.5, 0.8);
      const a = this.aim;
      w.bullets.push(new Bullet({
        x: this.x + this.w / 2 + Math.cos(a) * 14, y: this.y + 8,
        vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, dmg: 8, life: 1.6, own: 'e', kind: 'pistol',
      }));
      SFX('mg', { v: 0.35 });
      FX.muzzle(this.x + this.w / 2 + Math.cos(a) * 16, this.y + 8, a, false);
    }
    this.aim = Math.atan2(p.cy - (this.y + 8), p.cx - (this.x + this.w / 2));
    if (this.x < w.camX - 80) this.face = 1;
    if (this.x > w.camX + VW + 120) this.face = -1;
    if (chance(0.5)) FX.dust(this.x + 4, this.y + this.h, 1, 'rgba(180,160,120,0.5)');
  }

  updateAnim() {
    let a = this.anim;
    if (this.panic > 0 && a !== 'panic') a = 'panic';
    else if (this.shootAnim > 0) a = 'crouch';
    else if (this.def.static) a = 'idle';
    else if (!this.onGround) a = this.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > 12) a = 'run';
    else a = 'idle';
    if (this.stun > 0) a = 'hurt';
    this.anim = a;
    const def = ANIMS[a];
    this.frame = Math.floor(this.animT * def[2]) % def[1];
  }

  draw(c, camX, camY) {
    if (this.dead) return;
    const d = this.def;
    c.save();
    c.translate(0, G.camShakeY * 0);
    switch (this.type) {
      case 'drone': {
        const spr = droneSprites[(G.time * 14 | 0) % 4];
        c.drawImage(spr, Math.round(this.x - camX), Math.round(this.y - camY));
        if (this.flash > 0) { c.globalAlpha = this.flash * 0.7; c.drawImage(whiten(spr), Math.round(this.x - camX), Math.round(this.y - camY)); c.globalAlpha = 1; }
        break;
      }
      case 'copter': {
        const spr = droneSprites[(G.time * 20 | 0) % 4];
        c.save();
        c.translate(this.x - camX, this.y - camY);
        c.scale(this.face, 1);
        c.drawImage(spr, 0, 0);
        c.drawImage(spr, 0, -10);
        c.restore();
        if (this.flash > 0) { c.globalAlpha = this.flash * 0.7; c.save(); c.translate(this.x - camX, this.y - camY); c.scale(this.face, 1); c.drawImage(whiten(spr), 0, 0); c.drawImage(whiten(spr), 0, -10); c.restore(); c.globalAlpha = 1; }
        break;
      }
      case 'turret': case 'emplacement': {
        const spr = this.type === 'turret' ? turretProp() : gunEmplacement();
        c.drawImage(spr, Math.round(this.x - camX), Math.round(this.y - camY));
        // barrel tracking player
        c.save();
        c.translate(Math.round(this.cx - camX), Math.round(this.cy - camY - 2));
        c.rotate(this.alert ? this.aim : Math.PI);
        R(c, 0, -2, 16, 4, '#141018'); R(c, 1, -1, 15, 2, '#4a4a58');
        c.restore();
        if (this.flash > 0) { c.globalAlpha = this.flash * 0.6; c.drawImage(whiten(spr), Math.round(this.x - camX), Math.round(this.y - camY)); c.globalAlpha = 1; }
        break;
      }
      case 'barrel': {
        const spr = this.type === 'barrel' && this.fuseT !== undefined ? barrel() : barrel();
        c.drawImage(spr, Math.round(this.x - camX), Math.round(this.y - camY));
        if (this.flash > 0) { c.globalAlpha = this.flash; c.drawImage(whiten(spr), Math.round(this.x - camX), Math.round(this.y - camY)); c.globalAlpha = 1; }
        break;
      }
      case 'jeep': {
        const spr = jeepFrame(Math.floor((this.bump || this.t) * 12) % 2);
        c.drawImage(spr, Math.round(this.x - camX), Math.round(this.y - camY));
        c.drawImage(jeepGunner(), Math.round(this.x - camX + (this.face > 0 ? 30 : 4)), Math.round(this.y - camY - 12));
        if (this.flash > 0) { c.globalAlpha = this.flash * 0.6; c.drawImage(whiten(spr), Math.round(this.x - camX), Math.round(this.y - camY)); c.globalAlpha = 1; }
        break;
      }
      default: {
        const spr = fighterFrame(d.pal, this.anim, this.frame, d.gun, { aim: this.face > 0 ? this.aim : Math.PI - this.aim });
        drawSpr(c, spr, this.cx - camX, this.y + this.h - camY, this.face, this.flash);
        // heavy armour plate
        if (this.type === 'heavy') {
          c.save();
          c.globalAlpha = 0.95;
          c.translate(Math.round(this.cx - camX + this.face * 4), Math.round(this.cy - camY));
          c.scale(this.face, 1);
          R(c, -1, -6, 8, 12, '#141018'); R(c, 0, -5, 6, 10, '#6a6a78'); R(c, 0, -5, 6, 2, '#8a8a9a');
          c.restore();
        }
        if (this.type === 'barrelman') {
          c.save();
          c.translate(Math.round(this.cx - camX), Math.round(this.cy - camY - 2));
          c.scale(this.face, 1);
          const blink = this.fuseT < 0.9 && (G.time * 10 | 0) % 2 ? '#ff4030' : '#f0d060';
          R(c, 0, -5, 7, 10, '#141018'); R(c, 1, -4, 5, 8, '#3a5a3a'); R(c, 1, -4, 5, 2, '#5a8a5a');
          R(c, 1, -6, 5, 2, blink);
          c.restore();
        }
        // rifle muzzle flash
        if (this.shootAnim > 0.05) {
          c.save();
          c.translate(Math.round(this.cx - camX + Math.cos(this.aim) * 12), Math.round(this.cy - camY + Math.sin(this.aim) * 10));
          c.rotate(this.aim);
          c.globalAlpha = clamp(this.shootAnim / 0.14, 0, 1);
          c.drawImage(muzzleFlash(), 0, -9);
          c.restore();
        }
      }
    }
    c.restore();
    // health pips for tough enemies
    if (this.maxHp > 5 && this.hp < this.maxHp && this.hp > 0) {
      const wpx = Math.round(this.cx - camX - 8), wpy = Math.round(this.y - camY - 5);
      R(c, wpx, wpy, 16, 3, '#141018');
      R(c, wpx + 1, wpy + 1, 14 * (this.hp / this.maxHp), 1, '#e05038');
    }
  }
}

const CRATE_CONTENT = {
  crate_mg: { weapon: 'mg', ammo: WEAPONS.mg.ammo, msg: 'WEAPON GET! MACHINE GUN' },
  crate_shotgun: { weapon: 'shotgun', ammo: WEAPONS.shotgun.ammo, msg: 'WEAPON GET! SPREAD GUN' },
  crate_flame: { weapon: 'flame', ammo: WEAPONS.flame.ammo, msg: 'WEAPON GET! FLAMETHROWER' },
  crate_rocket: { weapon: 'rocket', ammo: WEAPONS.rocket.ammo, msg: 'WEAPON GET! ROCKET LAUNCHER' },
  crate_laser: { weapon: 'laser', ammo: WEAPONS.laser.ammo, msg: 'WEAPON GET! LASER RIFLE' },
  crate_grenade: { ammo: null, grenades: 12, msg: 'GRENADES +12' },
  crate_ammo: { refil: true, msg: 'AMMO REFILL' },
  crate_health: { health: 2, msg: 'HEALTH UP' },
  crate_shield: { shield: true, msg: 'SHIELD UP' },
  crate_cover: { boom: true },
};

class Pickup {
  constructor(kind, x, y) {
    this.kind = CRATE_CONTENT['crate_'+kind] ? 'crate_'+kind : kind; this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.w = 14; this.h = 14; this.t = rnd(0, 6); this.dead = false;
    this.grounded = false; this.bounce = 0.35; this.life = 0;
    this.landed = false; this.spawnPop = 1;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  update(dt, w) {
    this.t += dt; this.life += dt;
    if (this.spawnPop > 0) this.spawnPop -= dt * 3;
    if (!this.landed || this.kind === 'medal' || this.kind === 'fruit' || this.kind === 'gold') {
      this.vy += 900 * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= Math.pow(0.02, dt);
      const gy = w.groundBelow(this.cx, this.y);
      if (gy !== null && this.y + this.h > gy) {
        this.y = gy - this.h;
        if (this.vy > 60) { this.vy = -this.vy * this.bounce; this.bounce *= 0.5; SFX('bounce', { v: 0.4, pitch: rnd(1.2, 1.6) }); }
        else { this.vy = 0; this.landed = true; }
        if (Math.abs(this.vy) < 20) { this.vy = 0; this.landed = true; }
      }
      if (w.solidAt(this.x, this.y) && this.vy < 0) this.vy = 0;
      this.x = clamp(this.x, 2, Level.W * TILE - 16);
    }
    if (this.y > Level.H * TILE + 40) this.dead = true;
  }
  draw(c, camX, camY) {
    const bx = Math.round(this.x - camX + this.w / 2);
    const by = Math.round(this.y - camY + this.h);
    const bob = this.landed ? Math.sin(this.t * 3.4) * 1.6 : 0;
    const isCrate = this.kind.indexOf('crate_') === 0;
    if (isCrate) {
      const spr = crate();
      c.drawImage(spr, bx - 8, by - 16);
      // glow
      const a = 0.25 + 0.2 * Math.sin(this.t * 4);
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = a;
      c.fillStyle = '#ffe060';
      c.fillRect(bx - 10, by - 20, 20, 20);
      c.restore();
      // icon bobbing above
      const ck = this.kind.slice(6);
      const icon = weaponIcon(WEAPONS[ck] ? ck : '') || pickupIcon('medal');
      const ic = WEAPONS[ck] ? weaponIcon(ck) : pickupIcon(ck === 'health' ? 'health' : ck === 'ammo' ? 'ammo' : ck === 'shield' ? 'shield' : ck === 'grenade' ? 'grenade' : 'star');
      c.drawImage(ic, bx - 7, by - 24 + Math.sin(this.t * 3) * 1.5);
      return;
    }
    const ic = pickupIcon(this.kind);
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.18 + 0.12 * Math.sin(this.t * 5);
    c.fillStyle = this.kind === 'gold' ? '#ffd040' : this.kind === 'fruit' ? '#ff7050' : '#fff0a0';
    c.fillRect(bx - 9, by - 16 + bob, 18, 18);
    c.restore();
    c.drawImage(ic, bx - 7, by - 14 + bob);
  }
}

class Captive {
  constructor(o) {
    this.x = o.x; this.y = o.y; this.w = 11; this.h = 22;
    this.reward = o; this.freed = false; this.t = rnd(0, 3);
    this.anim = 'salute'; this.frame = 0; this.animT = 0;
    this.rope = true; this.leaveT = 0; this.face = 1;
    this.gone = false; this.vx = 0; this.vy = 0; this.onGround = false;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }
  clampToWorld() { if(this.y>Level.H*TILE)this.gone=true; }
  update(dt, w) {
    this.t += dt; this.animT += dt;
    this.frame = Math.floor(this.animT * 8) % 4;
    if (this.freed) {
      this.leaveT += dt;
      if (this.leaveT > 1.4) this.anim = 'run';
      if (this.leaveT > 3.4) this.gone = true;
      if (this.anim === 'run') {
        this.vx=55;this.vy=Math.min(700,this.vy+1500*dt);
        Player.prototype.moveX.call(this,this.vx*dt,w);
        Player.prototype.moveY.call(this,this.vy*dt,w);
      }
    }
  }
  draw(c, camX, camY) {
    if (this.gone) return;
    const x = this.cx - camX, y = this.y + this.h - camY;
    // rope + post
    c.save();
    c.strokeStyle = '#8a7040'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x - 1, y - 20); c.lineTo(x - 1, y - 3); c.stroke();
    if (this.rope) {
      c.strokeStyle = '#c8a860'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x - 6, y - 12); c.lineTo(x + 5, y - 11); c.stroke();
      c.beginPath(); c.moveTo(x + 5, y - 11); c.lineTo(x + 1, y - 18); c.stroke();
    }
    c.restore();
    const spr = fighterFrame('civ', this.anim, this.frame, 'none', {});
    drawSpr(c, spr, x, y, this.face, this.t > 3 ? 0 : 0);
    if (this.freed && this.leaveT < 1.4) {
      const a = this.leaveT;
      text(c, 'THANKS!', x, y - 30 - a * 10, '#ffe060', 1, 'c');
    }
    if (!this.freed) {
      const bob = Math.sin(this.t * 3) * 1.5;
      c.save();
      c.globalAlpha = 0.4 + 0.3 * Math.sin(this.t * 4);
      c.fillStyle = '#ffe060';
      c.beginPath(); c.arc(x, y - 30 + bob, 2, 0, TAU); c.fill();
      c.restore();
    }
  }
}

/* ============================================================
   12 - DRIVABLE TRACKED VEHICLE "IRON HARE"
   ============================================================ */
class Vehicle {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 44; this.h = 26;
    this.vx = 0; this.vy = 0; this.hp = 14; this.maxHp = 14;
    this.active = true; this.ridden = false;
    this.bob = 0; this.tilt = 0; this.t = 0;
    this.trackF = 0; this.mgT = 0; this.cannonT = 0;
    this.dead = false; this.deadT = 0; this.flash = 0;
    this.aim = 0; this.hopT = 0; this.smokeT = 0;
    this.face = 1; this.onGround = true;
    this.ejectT = 0;
  }
  get cx() { return this.x + this.w / 2; }
  get feet() { return this.y + this.h; }
  clampToWorld() { this.x = clamp(this.x, 0, Level.W * TILE - this.w); }
  get cy() { return this.y + this.h / 2; }

  update(dt, w) {
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt * 4);
    if (this.dead) {
      this.deadT += dt;
      this.vy += 900 * dt; this.y += this.vy * dt;
      if (chance(0.6)) {
        FX.fireball(this.cx + rnd(-16,16), this.y + rnd(0,20), 0.6);
        FX.explosion(this.cx + rnd(-16, 16), this.y + rnd(0, 20), 0.5);
        this.hp = 0;
        if (this.deadT < 1.2 && w.player.state === 'normal' && w.vehicleOut) {
          // eject player
        }
      }
      if (this.deadT > 1.6) this.active = false;
      return;
    }
    const p = w.player;
    if (!this.ridden) {
      // idle engine smoke
      this.smokeT -= dt;
      if (this.smokeT <= 0) { this.smokeT = 0.4; FX.smokeTrail(this.x + 40, this.y + 4, 'rgba(110,110,115,0.5)', 2.5); }
      return;
    }
    const locked = w.inputLocked;
    const L = !locked && down('left'), R = !locked && down('right');
    const dir = (L ? -1 : 0) + (R ? 1 : 0);
    const SP = 132;
    this.vx = dir * SP;
    this.face = dir !== 0 ? dir : this.face;
    // physics
    this.vy += 1200 * dt;
    this.vy = Math.min(this.vy, 600);
    Player.prototype.moveX.call(this, this.vx * dt, w);
    Player.prototype.moveY.call(this, this.vy * dt, w);
    if (this.onGround) {
      this.trackF += Math.abs(this.vx) * dt * 0.35;
      this.bob = Math.sin(this.trackF * 3) * 1.2;
      if (Math.abs(this.vx) > 30 && chance(dt * 22)) {
        FX.dust(this.x + (this.face > 0 ? 2 : 42), this.y + this.h, 1, 'rgba(180,165,130,0.55)');
        SFX('step', { v: 0.4, pitch: 0.7 });
      }
    } else this.trackF += dt * 0.2;
    // hop
    if (!locked && hit('jump') && this.onGround) {
      this.vy = -300;
      SFX('jump', { pitch: 0.7 });
      FX.dust(this.x + 20, this.y + this.h, 5);
    }
    // aim
    let aim = this.face > 0 ? 0 : Math.PI;
    if (!locked && down('up')) aim = -Math.PI / 2;
    if (!locked && down('down')) aim = Math.PI / 2;
    this.aim = angLerp(this.aim, aim, 0.35);
    const hx = this.cx + Math.cos(this.aim) * 18, hy = this.cy + Math.sin(this.aim) * 14;
    // machine gun
    this.mgT -= dt;
    if (!locked && down('fire') && this.mgT <= 0) {
      this.mgT = 0.075;
      const a = this.aim + rnd(-0.05, 0.05);
      w.bullets.push(new Bullet({ x: hx, y: hy, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, dmg: 8, life: 0.45, own: 'p', kind: 'mg' }));
      SFX('mgheavy', { v: 0.55 });
      FX.muzzle(hx, hy, a, false);
      FX.shell(hx - Math.cos(a) * 4, hy - Math.sin(a) * 4, this.face);
      FX.shake(0.8);
      this.vx -= Math.cos(a) * 4;
    }
    // cannon
    this.cannonT -= dt;
    if (!locked && hit('special') && this.cannonT <= 0) {
      this.cannonT = 0.85;
      const a = this.aim;
      w.bullets.push(new Bullet({ x: hx, y: hy, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, dmg: 90, life: 1.6, own: 'p', kind: 'rocket', explode: 1.2, grav: 60, selfSafe: true }));
      SFX('cannon');
      FX.muzzle(hx, hy, a, true);
      FX.shake(5);
      this.vx -= Math.cos(a) * 40;
    }
    // crush
    for (const e of w.enemies) {
      if (e.dead) continue;
      if (aabb({ x: this.x + 2, y: this.y + 6, w: this.w - 4, h: this.h - 8 }, e) && e !== w.vehicle) {
        if (e.def.static) { e.hurt(999, w, this.cx); FX.hit(e.cx, e.cy, '#fff0a0', 8); SFX('clank'); }
        else if (!e.hitByCar) {
          e.hitByCar = 0.6;
          e.hurt(999, w, this.cx);
          FX.popup(e.cx, e.cy - 10, 'SQUASH!', '#ffd060');
          SFX('clank', { v: 1.2 });
          FX.shake(2.5);
          this.vx *= 0.9;
        }
      }
    }
    for (const pk of w.pickups) { if (!pk.dead && aabb(this, pk)) w.collect(pk); }
    // exit
    if (!locked && hit('down') && this.onGround) w.exitVehicle();
    this.smokeT -= dt;
    if (this.smokeT <= 0) { this.smokeT = 0.18; FX.smokeTrail(this.x + 40, this.y + 4, 'rgba(90,90,95,0.4)', 2.2); }
  }

  hurt(n, w) {
    if (this.dead) return;
    this.hp -= n;
    this.flash = 1;
    SFX('hitArmor', { v: 0.6 });
    FX.hit(this.cx + rnd(-12, 12), this.cy + rnd(-6, 6), '#c0c0d0', 6);
    if (this.hp <= 0) this.destroy(w);
  }
  destroy(w) {
    this.dead = true; this.deadT = 0;
    SFX('explodeBig');
    FX.fireball(this.cx, this.cy, 1.7);
    FX.explosion(this.cx, this.cy, 1.6);
    FX.shake(8);
    w.exitVehicle(true);
  }

  draw(c, camX, camY) {
    if (!this.active) return;
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY);
    if (this.dead) {
      c.save(); c.translate(x, y); c.rotate(Math.min(0.4, this.deadT * 0.3));
      c.globalAlpha = clamp(1 - (this.deadT - 1.2) * 2, 0, 1);
      c.drawImage(tankB, 0, 0);
      c.restore();
      if (chance(0.4)) { /* handled by fx */ }
      return;
    }
    c.save();
    // suspension tilt
    c.translate(x, y);
    c.rotate(this.tilt);
    c.translate(0, this.bob);
    if (this.face < 0) c.translate(this.w, 0);
    c.scale(this.face, 1);
    // tracks
    const tf = trackFrames[Math.floor(this.trackF) % 6];
    c.drawImage(tf, 2, this.h - 9);
    // body
    c.drawImage(tankB, 0, -4);
    c.restore();
    if (this.flash > 0) {
      c.save();
      c.globalAlpha = this.flash * 0.6;
      c.save();
      c.translate(x, y); c.rotate(this.tilt); c.translate(0, this.bob); if (this.face < 0) c.translate(this.w, 0); c.scale(this.face, 1);
      c.drawImage(whiten(tankB), 0, -4);
      c.drawImage(whiten(trackFrames[Math.floor(this.trackF) % 6]), 2, this.h - 9);
      c.restore();
      c.restore();
    }
    // muzzle
    const hx = this.cx + Math.cos(this.aim) * 20, hy = this.cy + Math.sin(this.aim) * 14;
    if (this.mgT > 0.06) {
      c.save();
      c.translate(Math.round(hx - camX), Math.round(hy - camY));
      c.rotate(this.aim); c.scale(this.face, 1);
      c.globalAlpha = clamp((this.mgT - 0.06) / 0.015, 0, 1);
      c.drawImage(muzzleFlash(), 0, -9);
      c.restore();
    }
    if (this.cannonT > 0.75) {
      c.save();
      c.translate(Math.round(hx - camX), Math.round(hy - camY));
      c.rotate(this.aim); c.scale(this.face, 1);
      c.drawImage(muzzleFlashBig(), 0, -15);
      c.restore();
    }
    // driver head visible
    if (this.ridden) {
      c.drawImage(jeepGunner(), Math.round(this.x - camX + 10), Math.round(this.y - camY - 10));
    }
  }
}

/* ============================================================
   13 - BOSS: "IRON MAW" tier-9 siege machine
   ============================================================ */
/* widest part of the machine (hull 168 wide, but the missile pod overhangs
   to x+188 and the head juts out to x-26) - used to frame the fight */
const BOSS_W = 190;
class Boss {
  constructor(w) {
    this.w = w;
    this.x = w.camX + VW + 120; this.y = Level.groundYAt(0) - 96;
    this.vx = 0; this.vy = 0;
    this.face = -1;
    this.hp = 260; this.maxHp = 260;
    this.phase = 0;
    this.state = 'enter'; this.t = 0; this.atkT = 2;
    this.parts = {
      head: { key: 'head', x: 0, y: 0, w: 66, h: 52, hp: 60, max: 60, broken: false },
      cannon: { key: 'cannon', x: 0, y: 0, w: 78, h: 34, hp: 55, max: 55, broken: false },
      pod: { key: 'pod', x: 0, y: 0, w: 56, h: 40, hp: 55, max: 55, broken: false },
      core: { key: 'core', x: 0, y: 0, w: 34, h: 34, hp: 90, max: 90, broken: false, hidden: true },
    };
    this.dead = false; this.deathT = 0;
    this.flash = 0; this.slamY = 0; this.charge = 0;
    this.summoned = 0; this.beamT = 0; this.beamWarn = 0;
    this.roar = false;
    this.shakeT = 0;
    this.intro = 0;
  }
  get cx() { return this.x + 84; }
  get cy() { return this.y + 48; }
  get top() { return this.y; }

  layout() {
    const p = this.parts;
    p.head.x = this.x - 26; p.head.y = this.y + 2;
    p.cannon.x = this.x + 8; p.cannon.y = this.y + 34;
    p.pod.x = this.x + 132; p.pod.y = this.y + 16;
    p.core.x = this.x + 66; p.core.y = this.y + 30;
  }

  start(w) {
    this.state = 'enter';
    this.intro = 0;
    SFX('bossRoar');
    FX.shake(9);
    w.lockCamera(true);
    w.msg('WARNING!  TIER-9 SIEGE MACHINE', '#ff4030', 2.6);
    w.msg('IRON MAW', '#ffd040', 2.0);
    Audio_.playMusic('boss');
  }

  hurt(part, dmg, w) {
    const p = this.parts[part];
    if (this.dead || !p || p.broken || p.hidden) { FX.hit(this.cx, this.y + 20, '#c0c0d0', 4); SFX('hitArmor', { v: 0.4 }); return; }
    const dealt = Math.min(p.hp, dmg);
    p.hp = Math.max(0, p.hp - dmg);
    this.flash = 0.6;
    FX.hit(p.x + p.w / 2, p.y + p.h / 2, '#ffd060', 5);
    SFX('hitArmor', { v: 0.5 });
    if (p.hp <= 0) {
      p.broken = true;
      FX.fireball(p.x + p.w / 2, p.y + p.h / 2, 1.4);
      FX.explosion(p.x + p.w / 2, p.y + p.h / 2, 1.4);
      FX.shake(6);
      SFX('explodeBig');
      if (part === 'cannon' || part === 'pod') {
        this.checkPhase();
        if (this.parts.cannon.broken && this.parts.pod.broken) {
          this.parts.core.hidden = false;
          w.msg('CORE EXPOSED!', '#ffd040', 2);
        }
      }
    }
    this.hp = Math.max(0, this.hp - dealt);
    this.checkPhase();
    if (this.parts.core.broken || this.hp <= 0) this.die(w);
  }
  checkPhase() {
    const frac = this.hp / this.maxHp;
    const total = this.parts.cannon.hp + this.parts.pod.hp + (this.parts.core.hidden ? 0 : this.parts.core.hp);
    if (!this.parts.cannon.broken || !this.parts.pod.broken) {
      if (frac < 0.62 && this.phase < 1) {
        this.phase = 1;
        this.w.msg('ENRAGED!', '#ff6040', 1.6);
        this.atkT = 0.4;
      }
    } else if (frac < 0.3 && this.phase < 2) {
      this.phase = 2;
      this.w.msg('FINAL FORM!', '#ff3020', 1.8);
      this.atkT = 0.3;
    }
  }

  die(w) {
    if (this.dead) return;
    this.dead = true; this.deathT = 0;
    this.hp = 0;
    Audio_.playMusic('action');
  }

  update(dt, w) {
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt * 3);
    if (this.shakeT > 0) this.shakeT -= dt;
    const p = w.player;

    if (this.dead) {
      this.deathT += dt;
      this.vx *= 0.9;
      this.x += this.vx * dt;
      if (this.deathT < 2.6) {
        if (chance(0.55)) {
          const ex = this.x + rnd(20, 150), ey = this.y + rnd(10, 90);
          FX.fireball(ex, ey, 0.9);
          FX.explosion(ex, ey, 0.8);
          SFX('explode', { v: 0.7 });
          FX.shake(4);
        }
        if (this.deathT > 0.6 && chance(0.3)) FX.smokeTrail(this.x + rnd(0, 160), this.y + rnd(0, 90), 'rgba(60,55,55,0.7)', 4);
      }
      if (this.deathT > 1.4 && !this.finalExplosions) {
        this.finalExplosions = true;
        for (let i = 0; i < 5; i++) {
          setTimeout(() => { if (w.active) { FX.fireball(this.x + rnd(0,160), this.y + rnd(0,90), 2.0); FX.explosion(this.x + rnd(0,160), this.y + rnd(0,90), 1.6); FX.shake(10); SFX("explodeBig"); } }, i * 130);
        }
      }
      if (this.deathT > 2.6) { w.bossDefeated(); }
      return;
    }

    const gy = Level.groundYAt(this.cx);
    this.layout();
    const targetY = gy - 96;
    const speed = this.phase >= 2 ? 46 : this.phase >= 1 ? 38 : 30;

    switch (this.state) {
      case 'enter': {
        this.intro += dt;
        this.x -= 90 * dt;
        this.y = lerp(this.y, targetY, 0.05);
        this.bobT = (this.bobT || 0) + dt;
        this.bob = Math.sin(this.bobT * 6) * 2;
        if (chance(0.6)) FX.dust(this.x + 20 + rnd(0, 140), this.y + 96, 1, 'rgba(160,150,130,0.5)');
        if (this.x < w.camX + VW - BOSS_W - 20) {
          this.state = 'fight';
          w.msg('DESTROY IT!', '#ffffff', 1.6);
          FX.shake(6);
          w.bossActive = true;
        }
        break;
      }
      case 'fight': {
        this.bobT = (this.bobT || 0) + dt;
        this.bob = Math.sin(this.bobT * 5) * 1.6;
        // pacing
        this.atkT -= dt;
        if (this.atkT <= 0) {
          const roll = Math.random();
          if (this.phase === 0) this.atk = roll < 0.45 ? 'cannon' : roll < 0.75 ? 'slam' : 'summon';
          else if (this.phase === 1) this.atk = roll < 0.3 ? 'cannon' : roll < 0.55 ? 'missiles' : roll < 0.8 ? 'slam' : 'beam';
          else this.atk = roll < 0.28 ? 'cannon' : roll < 0.5 ? 'missiles' : roll < 0.68 ? 'slam' : roll < 0.85 ? 'beam' : 'summon';
          this.atkPhase = 0;
          this.actT = 0;
          this.act = this.atk;
          if (this.act === 'slam') { this.actT = 0.75; SFX('engine', { v: 0.8 }); }
          if (this.act === 'beam') { this.beamWarn = 0.9; SFX('alarm', { v: 0.5 }); }
          this.atkT = this.phase >= 2 ? rnd(1.5, 2.3) : this.phase >= 1 ? rnd(1.9, 2.8) : rnd(2.4, 3.4);
        }
        this.runAttack(dt, w, p);
        // movement: pace across the right-hand half of the arena
        const center = w.camX + VW - BOSS_W - 40;
        if (this.x > center + 40) this.vx = -speed;
        else if (this.x < center - 60) this.vx = speed;
        else this.vx = Math.sin(this.t * 0.6) * speed * 0.6;
        if (this.act === 'slam' && this.actPhase === 1) this.vx = 0;
        this.x += this.vx * dt;
        this.x = clamp(this.x, w.camX + 20, w.camX + VW - BOSS_W - 14);
        this.y = lerp(this.y, targetY, 0.08);
        this.face = -1;
        if (chance(0.35)) FX.smokeTrail(this.x + rnd(10, 150), this.y - 6, 'rgba(90,85,85,0.5)', 3);
        break;
      }
    }
  }

  runAttack(dt, w, p) {
    this.actT -= dt;
    const a = Math.atan2(p.cy - (this.y + 46), p.cx - (this.cx));
    switch (this.act) {
      case 'cannon': {
        this.actPhase = 0;
        if (this.parts.cannon.broken) { this.act = 'summon'; this.actT = 0.6; break; }
        if (this.actT <= 0) {
          this.actT = 0.16;
          this.burst = (this.burst || 0) + 1;
          const cx = this.parts.cannon.x + 40, cy = this.parts.cannon.y + 16;
          for (let i = -1; i <= 1; i++) {
            const ang = a + i * 0.16;
            w.bullets.push(new Bullet({ x: cx, y: cy, vx: Math.cos(ang) * 215, vy: Math.sin(ang) * 215, dmg: 14, life: 2.4, own: 'e', kind: 'ebolt', r: 3 }));
          }
          FX.muzzle(cx + 30, cy, a, true);
          SFX('cannon', { v: 0.5 });
          FX.shake(1.5);
          if (this.burst >= (this.phase >= 1 ? 4 : 3)) { this.burst = 0; this.act = null; }
        }
        break;
      }
      case 'missiles': {
        this.actPhase = 0;
        if (this.actT <= 0) {
          this.actT = 0.18;
          this.burst = (this.burst || 0) + 1;
          const px = this.parts.pod.x + 28, py = this.parts.pod.y + 20;
          const ang = a + rnd(-0.5, 0.5);
          w.bullets.push(new Bullet({ x: px, y: py, vx: Math.cos(ang) * 120, vy: Math.sin(ang) * 120 - 40, dmg: 16, life: 3.2, own: 'e', kind: 'grenade', grav: 150, explode: 0.6, selfSafe: true }));
          SFX('thrown', { v: 0.5 });
          FX.muzzle(px, py, ang, false);
          if (this.burst >= 5) { this.burst = 0; this.act = null; }
        }
        break;
      }
      case 'slam': {
        this.actPhase = this.actT > 0.2 ? 0 : 1;
        if (this.actT <= 0) {
          this.act = null;
          this.shakeT = 0.4;
          FX.shake(10);
          SFX('explodeBig', { v: 0.6 });
          for (let i = 0; i < 5; i++) {
            const sx = this.x + 20 + rnd(0, 130), sy = this.y + 80 + rnd(0, 16);
            FX.fireball(sx, sy, 0.7);
            FX.explosion(sx, sy, 0.5);
          }
          const gy = Level.groundYAt(this.x);
          // shockwaves
          for (let k = 0; k < 2; k++) {
            w.shockwaves.push({ x: this.x + 30, y: gy - 6, vx: (k ? 1 : -1) * 190, life: 1.6, t: 0 });
          }
          // falling debris
          for (let i = 0; i < 5; i++) {
            w.bullets.push(new Bullet({ x: this.x + rnd(10, 150), y: this.y - 10, vx: rnd(-30, 30), vy: 60, dmg: 16, life: 3, own: 'e', kind: 'grenade', grav: 300, explode: 0.5, selfSafe: true }));
          }
        }
        break;
      }
      case 'beam': {
        this.actPhase = 0;
        this.beamWarn -= dt;
        if (this.beamWarn <= 0 && !this.beamed) {
          this.beamed = true;
          const hy = this.y + 30;
          w.bossBeams.push({ x: this.x - 20, y: hy, t: 0, life: 0.9, h: 22 });
          SFX('laser', { v: 1, pitch: 0.4 });
          FX.shake(4);
        }
        if (this.beamed && this.actT <= 0) { this.act = null; this.beamed = false; this.beamWarn = 0; }
        break;
      }
      case 'summon': {
        this.actPhase = 0;
        if (this.actT <= 0) {
          this.act = null;
          for (let i = 0; i < 2; i++) {
            w.spawnEnemy('soldier', this.x + 40 + i * 26, this.y - 40 - i * 10, 'drop');
          }
          w.msg('REINFORCEMENTS!', '#ff8030', 1.2);
        }
        break;
      }
      default: this.actPhase = 0;
    }
    if (!this.act) this.actPhase = 0;
  }

  hitBullets(bullets, w) {
    // returns true if consumed
    for (const b of bullets) {
      if (b.dead) continue;
      for (const k in this.parts) {
        const p = this.parts[k];
        if (p.broken) continue;
        if (k === 'core' && p.hidden) continue;
        if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
          this.hurt(k, b.dmg, w);
          if (!b.explode) b.dead = true;
          if (b.explode) { b.boom(w); return true; }
          return true;
        }
      }
      // hull: armoured
      if (b.x > this.x && b.x < this.x + 168 && b.y > this.y + 8 && b.y < this.y + 96) {
        FX.hit(b.x, b.y, '#c0c0d0', 5);
        SFX('hitArmor', { v: 0.35 });
        b.dead = true;
        return true;
      }
    }
    return false;
  }

  draw(c, camX, camY) {
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY + (this.bob || 0));
    c.save();
    if (this.dead) c.globalAlpha = clamp(1 - (this.deathT - 1.6) * 0.8, 0, 1);
    // shadow
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.beginPath(); c.ellipse(x + 84, y + 98, 80, 8, 0, 0, TAU); c.fill();
    const flash = this.flash;
    const drawPart = (key, spr) => {
      const p = this.parts[key];
      const px = Math.round(p.x - camX), py = Math.round(p.y - camY + (this.bob || 0));
      if (p.broken) {
        // torn-off wreck: jagged black stub, torn plating, embers, smoke
        c.save();
        c.fillStyle = '#15151c';
        c.beginPath();
        c.moveTo(px + 2, py + p.h);
        for (let i = 0; i <= 6; i++) {
          const t = i / 6;
          const jag = (i % 2 ? 3 : 9) + hash2(i, p.h) * 8;
          c.lineTo(px + 2 + t * (p.w - 4), py + p.h - 6 - jag);
        }
        c.lineTo(px + p.w - 2, py + p.h);
        c.closePath(); c.fill();
        // exposed frame ribs
        c.strokeStyle = '#3c414c'; c.lineWidth = 2;
        for (let i = 1; i < 4; i++) {
          const xx = px + 4 + (i / 4) * (p.w - 8);
          c.beginPath(); c.moveTo(xx, py + p.h - 4); c.lineTo(xx + rnd(-4, 4), py + 6); c.stroke();
        }
        // hanging cable
        c.strokeStyle = '#22262e'; c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(px + p.w * 0.4, py + 8);
        c.quadraticCurveTo(px + p.w * 0.55, py + 20, px + p.w * 0.3, py + 30);
        c.stroke();
        // embers
        if (chance(0.5)) {
          c.save();
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = 0.5 + Math.random() * 0.4;
          c.fillStyle = '#ff7020';
          c.fillRect(px + rnd(3, p.w - 6), py + p.h - rnd(8, 18), 3, 2);
          c.restore();
        }
        if (chance(0.35)) FX.smokeTrail(px + rnd(2, p.w - 2), py + 4, 'rgba(70,65,65,0.55)', 3);
        c.restore();
        return;
      }
      c.drawImage(spr, px, py);
      if (flash > 0) { c.save(); c.globalAlpha = flash * 0.55; c.drawImage(whiten(spr), px, py); c.restore(); }
      if (p.hp < p.max * 0.4) {
        if (chance(0.14)) { FX.smokeTrail(px + rnd(4, p.w - 4), py + 4, 'rgba(80,75,75,0.55)', 3); }
      }
    };
    // hull has no weak-point entry of its own
    c.drawImage(bossParts.hull, Math.round(this.x - camX), y);
    // head
    const hd = this.parts.head;
    if (!hd.broken) {
      const hx = Math.round(hd.x - camX), hy = Math.round(hd.y - camY + (this.bob || 0));
      c.save(); c.translate(hx + 33, hy + 22); c.scale(-1, 1);
      const wob = Math.sin(this.t * 3) * 0.05;
      c.rotate(wob);
      c.drawImage(bossParts.head, -33, -22);
      // visor glow
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.5 + 0.3 * Math.sin(this.t * 5);
      c.fillStyle = this.phase >= 1 ? '#ff4020' : '#e0603a';
      c.fillRect(-24, -6, 44, 6);
      c.restore();
      if (this.beamWarn > 0 && this.beamed !== true) {
        c.save(); c.globalAlpha = 0.6; c.fillStyle = '#ff3020'; c.fillRect(-24, -6, 44 * (1 - this.beamWarn), 6); c.restore();
      }
      c.restore();
      if (flash > 0) { c.save(); c.globalAlpha = flash * 0.5; c.drawImage(whiten(bossParts.head), hx, hy); c.restore(); }
    }
    drawPart('cannon', bossParts.cannon);
    drawPart('pod', bossParts.pod);
    // core
    const co = this.parts.core;
    if (!co.hidden) {
      const px = Math.round(co.x - camX), py = Math.round(co.y - camY + (this.bob || 0));
      c.save();
      c.translate(px + 17, py + 17);
      c.rotate(this.t * (co.broken ? 0 : 1.4));
      c.drawImage(bossParts.core, -17, -17);
      c.restore();
      if (!co.broken) {
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = 0.30 + 0.16 * Math.sin(this.t * 6);
        c.drawImage(glowSprite('rgb(255,112,48)'), px - 14, py - 14);
        c.restore();
      }
    }
    // targeting brackets on the live weak points so the fight is readable
    c.save();
    for (const k of ['cannon', 'pod', 'core']) {
      const p = this.parts[k];
      if (p.broken || (k === 'core' && p.hidden)) continue;
      const px = p.x - camX, py = p.y - camY + (this.bob || 0);
      const bl = 7, a = 0.5 + 0.3 * Math.sin(this.t * 5);
      c.strokeStyle = 'rgba(255,80,60,' + a.toFixed(2) + ')';
      c.lineWidth = 1;
      for (const [sx, sy] of [[0, 0], [p.w, 0], [0, p.h], [p.w, p.h]]) {
        const dx = sx === 0 ? 1 : -1, dy = sy === 0 ? 1 : -1;
        c.beginPath();
        c.moveTo(px + sx + dx * bl, py + sy); c.lineTo(px + sx, py + sy); c.lineTo(px + sx, py + sy + dy * bl);
        c.stroke();
      }
    }
    c.restore();
    c.restore();
  }
}

/* ============================================================
   14 - WORLD: gameplay scene, waves, camera, HUD
   ============================================================ */
class World {
  constructor(fresh) {
    this.active = true;
    this.camX = 0; this.camY = 0; this.lockX = 0; this.camLock = null;
    this.bullets = []; this.grenades = []; this.lasers = [];
    this.enemies = []; this.corpses = []; this.pickups = []; this.captives = [];
    this.shockwaves = []; this.bossBeams = [];
    this.messages = []; this.prompts = [];
    this.boss = null; this.bossActive = false;
    this.waveIndex = -1; this.waveActive = null; this.waveClearT = 0;
    this.time = 0; this.finished = false; this.finishT = 0;
    this.zoneMsgT = 0; this.lastZone = 0;
    this.checkpoint = { x: 48, y: Level.groundYAt(48) - 22, set: false, waveIndex: -1, marker: -1 };
    this.inputLocked = false;
    this.hitPause = 0;
    this.events = {};
    this.rockT = 0;
    this.tally = null;
    this.lowAmmoWarn = 0;
    if (fresh) {
      this.score = 0; this.lives = 3; this.rescued = 0; this.totalCaptives = 0;
      this.startX = 48; this.startY = 0;
    }
    this.player = new Player(this.startX, this.startY);
    this.player.grenades = 8;
    this.player.y = Level.groundYAt(this.startX) - this.player.h;
    this.vehicle = new Vehicle(Level.vehicleX, Level.groundYAt(Level.vehicleX) - 26);
    this.totalCaptives = Level.captives.length;
    this.defeatedPosts = new Set();
    this.spawnFromLevel();
    Audio_.playMusic('action');
  }
  spawnFromLevel() {
    for (const p of Level.pickups) this.pickups.push(new Pickup(p.kind, p.x, p.y));
    for (const c of Level.captives) this.captives.push(new Captive(c));
    // static spawns are activated when near
    // Fixed guards already exist in the world; they never pop into view.
    this.spawnPosts();
  }
  spawnPosts() {
    for(let i=0;i<Level.spawns.length;i++){
      if(this.defeatedPosts.has(i))continue;
      const post=Level.spawns[i];
      const e=this.spawnEnemy(post.t,post.x,undefined,'ground',post.roof);
      e.postId=i;
    }
  }
  respawnAtCheckpoint() {
    const p = this.player;
    this.vehicle.ridden = false;
    p.reset(this.checkpoint.x, this.checkpoint.y);
    p.hp = p.maxHp;
    this.bullets.length = 0; this.grenades.length = 0; this.lasers.length = 0;
    this.shockwaves.length=0;this.bossBeams.length=0;this.prompts.length=0;
    Particles.length=0;G.hitStop=0;G.shake=G.camShakeX=G.camShakeY=0;
    p.invuln=2;this.deathT=0;this.inputLocked=false;
    for (const e of this.enemies) if (!e.dead) e.dead = true;
    this.enemies.length = 0;
    this.waveIndex = this.checkpoint.waveIndex;
    this.waveActive = null;
    this.camLock = null;
    if(this.boss && !this.boss.dead){this.boss=null;this.bossActive=false;}
    this.camX = clamp(p.cx - VW * 0.42, 0, Level.W * TILE - VW);
    this.camY=clamp(p.y-VH*0.56,0,Level.H*TILE-VH);
    this.spawnPosts();
    this.msg('CHECKPOINT - READY!', '#60f0f0', 1.5);
  }

  /* ---------- collision helpers ---------- */
  solidAt(x, y) {
    if (this.crateAt(x, y)) return true;
    return Level.solidAt(x, y);
  }
  crateAt(x, y) {
    for (const pk of this.pickups) {
      if (pk.dead || !pk.crate || pk.kind === 'crate_cover' && pk.breaking) continue;
      if (pk.kind.indexOf('crate_') !== 0) continue;
      if (x > pk.x && x < pk.x + 14 && y > pk.y && y < pk.y + 14) return true;
    }
    return false;
  }
  anySolid(x0, y0, x1, y1) {
    const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor((x1 - 0.01) / TILE);
    const ty0 = Math.floor(y0 / TILE), ty1 = Math.floor((y1 - 0.01) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const t = Level.tileAt(tx * TILE + 1, ty * TILE + 1);
        if (t === T_SOLID || t === T_SPIKE) return true;
        if (t === T_SPIKE) return true;
      }
    }
    if (this.crateAt(x0, y0) || this.crateAt(x1, y0) || this.crateAt(x0, y1) || this.crateAt(x1, y1) ||
        this.crateAt((x0 + x1) / 2, (y0 + y1) / 2)) return true;
    return false;
  }
  anyPlat(x0, y0, x1, y1) {
    const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor((x1 - 0.01) / TILE);
    const ty0 = Math.floor(y0 / TILE), ty1 = Math.floor((y1 - 0.01) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      if (Level.tileAt(tx * TILE + 1, ty * TILE + 1) === T_PLAT) return true;
    }
    return false;
  }
  platformTop(x0, x1, oldFeet, newFeet) {
    for (let ty = Math.max(0, Math.floor((oldFeet - 0.02) / TILE)); ty <= Math.floor(newFeet / TILE); ty++) {
      const top = ty * TILE;
      if (oldFeet > top + 0.02 || newFeet < top) continue;
      for (let tx = Math.floor(x0 / TILE); tx <= Math.floor(x1 / TILE); tx++) {
        if (Level.tileAt(tx * TILE + 1, top + 1) === T_PLAT) return top;
      }
    }
    return null;
  }
  onLadder(x, y) { return Level.tileAt(x, y) === T_LADDER; }
  groundBelow(x, y) {
    const tx = Math.floor(x / TILE);
    if (tx < 0 || tx >= Level.W) return null;
    const start = Math.max(0, Math.floor(y / TILE));
    for (let ty = start; ty < Level.H; ty++) {
      const t = Level.tileAt(tx * TILE + 2, ty * TILE + 2);
      if (t === T_SOLID || t === T_PLAT) return ty * TILE;
    }
    return null;
  }
  addScore(n, x, y) {
    this.score += n;
    if (x !== undefined) FX.popup(x, y - 10, n, n >= 1000 ? '#ffd040' : '#ffffff');
    if (Math.floor(this.score / 30000) > Math.floor((this.score - n) / 30000)) { this.lives++; SFX('pickup'); this.msg('EXTRA LIFE!', '#60f0f0', 1.6); }
  }
  msg(txt, col, life) {
    this.messages.push({ txt, col: col || '#ffffff', t: 0, life: life || 1.6 });
    if (this.messages.length > 4) this.messages.shift();
  }
  showPrompt(txt, x, y) {
    for (const p of this.prompts) if (p.txt === txt) return;
    this.prompts.push({ txt, x, y, t: 0, life: 0.3 });
  }
  damagePlayer(n, srcX) { this.player.damage(n, this, srcX); }
  giveShield(p) { p.shield = 6; SFX('shield'); FX.popup(p.cx, p.y - 10, 'SHIELD!', '#60f0f0'); emit({ x: p.cx, y: p.cy, life: 0.4, kind: 'ring', col: 'rgba(96,240,240,0.8)', size: 8 }); }
  explodeDamage(x, y, dmg, radius, own) {
    // damage enemies
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (dist2(x, y, e.cx, e.cy) < radius * radius) {
        const falloff = 1 - Math.sqrt(dist2(x, y, e.cx, e.cy)) / radius;
        e.hurt(dmg * clamp(falloff, 0.15, 1), this, x, { pierce: true });
      }
    }
    // damage player (unless selfSafe or friendly)
    if (own === 'e') {
      if (dist2(x, y, this.player.cx, this.player.cy) < radius * radius) this.damagePlayer(1, x);
    }
    // crates & pickups
    for (const pk of this.pickups) {
      if (pk.dead || pk.kind.indexOf('crate_') !== 0) continue;
      if (dist2(x, y, pk.cx, pk.cy) < radius * radius * 0.8) this.breakCrate(pk);
    }
    // barrels chain
    for (const e of this.enemies) {
      if (e.dead || e.type !== 'barrel') continue;
      if (dist2(x, y, e.cx, e.cy) < radius * radius * 0.9) e.hurt(99, this, x);
    }
  }
  beamHit(x0, y0, x1, y1, dmg, own) {
    if (own === 'e') {
      const p = this.player;
      if (segRect(x0, y0, x1, y1, p.x, p.y, p.w, p.h)) this.damagePlayer(1, x0);
    } else {
      for (const e of this.enemies) {
        if (e.dead) continue;
        if (segRect(x0, y0, x1, y1, e.x, e.y, e.w, e.h)) e.hurt(dmg, this, x0);
      }
      if (this.boss && !this.boss.dead) this.boss.hitBullets([{ x: (x0 + x1) / 2, y: (y0 + y1) / 2, dead: false }], this);
    }
  }
  knifeHit(x, y, dir, range, arc) {
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (dist2(x, y, e.cx, e.cy) < range * range) e.hurt(3, this, x - dir * 10);
    }
    for (const pk of this.pickups) {
      if (pk.dead || pk.kind.indexOf('crate_') !== 0) continue;
      if (dist2(x, y, pk.cx, pk.cy) < range * range) this.breakCrate(pk);
    }
    for (const c of this.captives) {
      if (c.freed || c.gone) continue;
      if (dist2(x, y, c.cx, c.cy) < range * range) this.freeCaptive(c);
    }
    if (this.boss && !this.boss.dead) {
      for (const k in this.boss.parts) {
        const p = this.boss.parts[k];
        if (p.broken || (k === 'core' && p.hidden)) continue;
        if (p.x < x + 6 && p.x + p.w > x - 6) { this.boss.hurt(k, 12, this); break; }
      }
    }
    FX.hit(x + dir * 8, y, '#ffffff', 4);
  }
  enemyPosition(type, x, preferredY, roof = false) {
    const d = ETYPE[type];
    x = clamp(x, 2, Level.W * TILE - d.w - 2);
    if (d.fly) {
      let y = preferredY === undefined ? Level.groundYAt(x) - 100 : preferredY;
      for (let offset = 0; offset < 160; offset += 4) {
        for (const candidate of [y + offset, y - offset]) {
          if (candidate > 16 && !this.anySolid(x, candidate, x + d.w, candidate + d.h)) return {x,y:candidate};
        }
      }
    }
    // Locate a complete support surface with enough headroom for this enemy.
    for (let offset = 0; offset <= 160; offset += TILE) {
      for (const candidateX of [x + offset, x - offset]) {
        if (candidateX < 1 || candidateX + d.w >= Level.W*TILE) continue;
        const base = roof ? 2 : Math.max(2, Math.floor(Level.groundYAt(candidateX)/TILE)-2);
        for (let row = base; row < Level.H; row++) {
          const feet = row*TILE, y=feet-d.h;
          if (this.anySolid(candidateX,y,candidateX+d.w,feet)) continue;
          const supported = px => Level.solidAt(px,feet+1) || Level.platAt(px,feet+1);
          if (supported(candidateX+1) && supported(candidateX+d.w-1)) return {x:candidateX,y};
        }
      }
    }
    return {x,y:Level.groundYAt(x)-d.h};
  }
  spawnEnemy(type, x, y, entrance, roof = false) {
    const pos = this.enemyPosition(type, x, y, roof);
    const e = new Enemy(type, pos.x, pos.y, 'ground');
    e.face = this.player.cx < e.cx ? -1 : 1;
    e.spawnT = 0.65;
    e.onGround = !e.def.fly;
    this.enemies.push(e);
    return e;
  }
  lineClear(x0,y0,x1,y1) {
    const steps=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/4));
    for(let i=1;i<steps;i++)if(Level.solidAt(lerp(x0,x1,i/steps),lerp(y0,y1,i/steps)))return false;
    return true;
  }
  canEnemyAttack(e) {
    return e.spawnT <= 0 && e.stun <= 0 && this.player.state === 'normal' &&
      e.cx >= this.camX + 8 && e.cx <= this.camX + VW - 8 &&
      this.lineClear(e.cx,e.cy-2,this.player.cx,this.player.cy);
  }
  spawnPickup(x, y, kind) {
    this.pickups.push(new Pickup(kind, x - 7, y - 7));
  }
  breakCrate(pk) {
    if (pk.dead) return;
    pk.dead = true;
    const c = CRATE_CONTENT[pk.kind] || {};
    for (let i = 0; i < 10; i++) {
      emit({
        x: pk.cx, y: pk.cy, vx: rnd(-140, 140), vy: rnd(-190, -30), g: 700, life: rnd(0.5, 1.1),
        kind: 'debris', col: '#a07840', col2: '#5a4020', size: rnd(2, 4), rot: rnd(0, 6), vr: rnd(-12, 12), bounce: 1,
      });
    }
    SFX('clank', { v: 0.8 });
    if (c.weapon) {
      this.pickups.push(new Pickup(pk.kind, pk.x, pk.y));
      this.pickups[this.pickups.length - 1].bounce = 0.1;
    } else if (c.boom) {
      FX.fireball(pk.cx, pk.cy, 0.6);
      FX.explosion(pk.cx, pk.cy, 0.5);
      SFX('explode', { v: 0.5 });
    }
  }
  collect(pk) {
    if (pk.dead) return;
    const k = pk.kind;
    if (k === 'medal' || k === 'fruit' || k === 'gold') {
      pk.dead = true;
      this.addScore(k === 'gold' ? 1000 : k === 'fruit' ? 300 : 500, pk.cx, pk.cy);
      SFX(k === 'gold' ? 'coin' : 'coin', { v: 0.7 });
      emit({ x: pk.cx, y: pk.cy, life: 0.3, kind: 'flash', col: 'rgba(255,230,150,0.8)', size: 6 });
      return;
    }
    const c = CRATE_CONTENT[k] || {};
    if (c.boom) return;                     // cover crates are only broken, not collected
    pk.dead = true;
    let msg = null;
    if (c.weapon) {
      this.player.weapon = c.weapon;
      this.player.ammo[c.weapon] = (this.player.ammo[c.weapon] || 0) + c.ammo;
      msg = c.msg;
      SFX('weaponGet');
      FX.shake(2);
    } else if (c.grenades) {
      this.player.grenades = Math.min(this.player.maxGrenades, this.player.grenades + c.grenades);
      msg = c.msg; SFX('pickup');
    } else if (c.refil) {
      for (const weapon in this.player.ammo) this.player.ammo[weapon] += Math.ceil(WEAPONS[weapon].ammo / 2);
      msg = c.msg; SFX('pickup');
    } else if (c.health) {
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + c.health);
      msg = c.msg; SFX('heal');
    } else if (c.shield) {
      this.giveShield(this.player);
      msg = c.msg; SFX('shield');
    }
    if (msg) this.msg(msg, '#ffe060', 1.4);
  }
  freeCaptive(c) {
    if (c.freed) return;
    c.freed = true; c.rope = false;
    this.rescued++;
    SFX('rescue');
    this.addScore(c.reward.pts || 200, c.cx, c.cy - 20);
    FX.popup(c.cx, c.cy - 30, 'FREE!', '#60f0f0');
    const it = c.reward.item;
    if (it && it !== 'medal' && it !== 'fruit' && it !== 'gold' && WEAPONS[it]) {
      this.spawnPickup(c.cx, c.cy - 10, 'crate_' + it);
      this.msg('WEAPON GET! ' + WEAPONS[it].name, '#ffe060', 1.6);
    } else if (it && CRATE_CONTENT['crate_' + it]) {
      this.spawnPickup(c.cx, c.cy - 10, 'crate_' + it);
      this.msg('BONUS! ' + it.toUpperCase(), '#ffe060', 1.4);
    } else if (it) {
      this.spawnPickup(c.cx, c.cy - 10, it);
    }
    if (c.reward.secret) {
      const s = Level.secrets[c.reward.secret - 1];
      if (s) { s.found = true; this.msg('SECRET AREA FOUND!', '#c060ff', 2); this.addScore(1000, c.cx, c.cy - 34); }
    }
  }
  enterVehicle() {
    if (this.vehicle.dead || !this.vehicle.active) return;
    this.vehicle.ridden = true;
    this.player.state = 'normal';
    this.player.vehicle = this.vehicle;
    SFX('engine');
    this.msg('IRON HARE!  Z=FIRE  V=CANNON  DOWN=EXIT', '#a0e0ff', 2.6);
    FX.shake(3);
  }
  exitVehicle(forced) {
    const v = this.vehicle;
    if (!v.ridden && !forced) return;
    v.ridden = false;
    this.vehicleOut = true;
    const p = this.player;
    p.vehicle = null;
    p.x = v.x - 10; p.y = v.y - 4;
    p.state = 'normal';
    p.invuln = Math.max(p.invuln, 1.4);
    p.vy = -180;
    if (forced) {
      this.msg('HOP OUT!', '#ff8040', 1.6);
      FX.fireball(v.cx, v.cy, 1.8);
      FX.explosion(v.cx, v.cy, 1.8);
    }
  }
  lockCamera(on) { this.camLock = on ? this.camX : null; }
  msgBanner() { }
  bossDefeated() {
    if (this.finished) return;
    this.finished = true;
    this.finishT = 0;
    this.player.state = 'victory';
    SFX('victory');
    Audio_.playMusic('action');
    this.tally = {
      score: this.score, rescued: this.rescued, total: this.totalCaptives,
      lives: this.lives, time: this.time,
    };
  }

  /* ================= UPDATE ================= */
  update(dt) {
    this.time += dt;
    const p = this.player;
    if (this.finished) {
      this.finishT += dt;
      this.updateCamera(dt, true);
      this.updateEntities(dt, true);
      if (this.finishT > 2.2) { this.active = false; Scene.set('complete', this.tally); }
      return;
    }
    // pause
    if (hit('pause')) { Scene.set('pause'); return; }
    if (hit('mute')) { G.muted = !G.muted; Audio_.setMuted(G.muted); this.msg(G.muted ? 'SOUND OFF' : 'SOUND ON', '#a0e0ff', 1); }
    if (p.state === 'dead') {
      p.update(dt, this);
      this.deathT = (this.deathT || 0) + dt;
      if (this.deathT > 1.8) {
        this.lives--;
        this.deathT = 0;
        if (this.lives <= 0) { this.active = false; Scene.set('gameover', this); return; }
        this.respawnAtCheckpoint();
      }
      this.updateEntities(dt, false);
      return;
    }
    this.deathT = 0;
    this.updateCamera(dt, false);
    // while driving, the player body is slaved to the vehicle (see updateEntities)
    if (!this.vehicle.ridden) p.update(dt, this);
    else { p.invuln = Math.max(0, p.invuln - dt); p.hitFlash = Math.max(0, p.hitFlash - dt * 4); }
    this.updateWaves(dt);
    this.updateEvents(dt);
    this.updateCheckpoints();
    this.updateEntities(dt, false);
    this.updateHUDState(dt);
  }

  updateCamera(dt, cinematic) {
    const p = this.player;
    if (p.state === 'dead') return;
    const targetX = p.cx - VW * 0.42;
    let tx = clamp(targetX, 0, Level.W * TILE - VW);
    // during the boss fight, frame the player on the left and the machine on
    // the right: the camera follows whichever edge needs to stay visible
    if (this.bossArenaLock && this.boss) {
      const bLeft = this.boss.x - 30, bRight = this.boss.x + BOSS_W;
      // camera must not scroll so far right that the machine runs off the edge
      const maxCam = bRight - VW + 8;
      // ...nor so far left that the player leaves the frame
      const minCam = p.cx - VW + 70;
      tx = clamp(tx, Math.min(minCam, maxCam), Math.max(minCam, maxCam));
      tx = clamp(tx, 0, Level.W * TILE - VW);
    }
    if (this.camLock !== null) {
      this.camX = this.camLock;
    } else {
      const k = cinematic ? 0.03 : 0.12;
      this.camX = lerp(this.camX, tx, k);
    }
    // vertical: follow the player, biased so their head sits above centre
    const wantY = (p.y + p.h * 0.4) - VH * 0.46;
    const groundY = Level.groundYAt(clamp(this.camX + VW / 2, 0, Level.W * TILE - 2)) - 196;
    const ty = lerp(wantY, groundY, 0.4);
    this.camY = lerp(this.camY, clamp(ty, 0, Level.H * TILE - VH), 0.06);
    this.camX = clamp(this.camX, 0, Level.W * TILE - VW);
  }

  updateWaves(dt) {
    const p = this.player;
    if (!this.waveActive && this.waveIndex + 1 < Level.waves.length) {
      const def = Level.waves[this.waveIndex + 1];
      if (p.cx >= def.x*TILE) {
        this.waveIndex++;
        const queue=[];
        for(const [type,count]of def.list)for(let i=0;i<count;i++)queue.push(type);
        this.waveActive={def,list:[],queue,timer:0.9};
        this.camLock=clamp(def.x*TILE-VW*0.4,0,Level.W*TILE-VW);
        this.camX=this.camLock;
        this.msg(def.msg+' - ENEMIES AHEAD', '#ffb060',2);
        SFX('lock');
      }
    }
    const wave=this.waveActive;
    if(wave){
      wave.timer-=dt;
      if(wave.queue.length && wave.timer<=0 && wave.list.filter(e=>!e.dead).length<4){
        const type=wave.queue.shift();
        let spawnX=Math.max(this.camLock+VW+16,p.cx+128);
        for(let attempt=0;attempt<8;attempt++){
          if(!this.enemies.some(e=>!e.dead && Math.abs(e.x-spawnX)<40))break;
          spawnX+=40;
        }
        const e=this.spawnEnemy(type,spawnX,this.camY+70,'ground');
        e.alert=1;e.face=-1;
        wave.list.push(e);wave.timer=0.7;
      }
      if(!wave.queue.length && !wave.list.some(e=>!e.dead)){
        wave.cleared=(wave.cleared||0)+dt;
        if(wave.cleared>0.4){
          this.camLock=null;this.waveActive=null;this.msg(wave.def.clear,'#60f0f0',1.6);
          SFX('unlock');this.addScore(500,p.cx,p.cy-20);this.setCheckpoint(Math.max(p.x,wave.def.x*TILE),true);
        }
      }
    }else this.goT=((this.goT||0)-dt)>0?this.goT-dt:1.6;
  }
  setCheckpoint(x, force = false, marker = this.checkpoint.marker) {
    if(!force && x<=this.checkpoint.x)return;
    const pos=this.enemyPosition('soldier',Math.max(x,this.checkpoint.x));
    this.checkpoint={...pos,set:true,waveIndex:this.waveIndex,marker};
    SFX('confirm');this.msg('CHECKPOINT SAVED', '#60f0f0', 1.8);
  }
  updateCheckpoints() {
    if(this.player.state!=='normal'||this.waveActive||this.bossActive)return;
    for(const point of Level.checkpoints){
      if(point.id>this.checkpoint.marker && this.player.cx>=point.x &&
        this.player.cx-point.x<80 && Math.abs(this.player.feet-point.y)<40){
        this.setCheckpoint(point.x,false,point.id);
      }
    }
  }

  updateEvents(dt) {
    const p = this.player;
    const ev = this.events;
    const z=Level.zoneAtPx(p.cx);
    // boss trigger
    if (!this.boss && !this.waveActive && p.cx > Level.bossTrigger) {
      this.boss = new Boss(this);
      this.boss.start(this);
      this.bossActive = true;
      // frame the fight: player on the left, machine on the right
      this.bossArenaLock = true;
    }
    // zone banner
    const zi = z.i;
    if (zi !== this.lastZone) {
      this.lastZone = zi;
      this.msg('- ' + z.name + ' -', '#ffffff', 2.4);
    }
  }

  updateEntities(dt, cinematic) {
    const p = this.player;
    // enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(dt, this);
      if (e.dead) {
        this.enemies.splice(i, 1);
        continue;
      }
      // separation so they don't stack
      for (let j = 0; j < i; j++) {
        const o = this.enemies[j];
        if (o.dead) continue;
        if (e.def.static || o.def.static) continue;
        if (Math.abs(e.cx - o.cx) < 9 && Math.abs(e.y - o.y) < 16) {
          const d = sign(e.cx - o.cx) || 1;
          e.x += d * 0.4; o.x -= d * 0.4;
        }
      }
    }
    // corpses
    for (let i = this.corpses.length - 1; i >= 0; i--) {
      this.corpses[i].update(dt, this);
      if (this.corpses[i].dead) this.corpses.splice(i, 1);
    }
    // player bullets
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      if (b.dead) { this.bullets.splice(i, 1); continue; }
      b.update(dt, this);
      if (b.dead) { this.bullets.splice(i, 1); continue; }
      if (b.own === 'p') {
        let hit = false;
        for (const e of this.enemies) {
          if (e.dead) continue;
          if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            // Explosive impact is one blast, not a direct hit plus the same blast again.
            if (b.explode) { b.boom(this); hit = true; break; }
            e.hurt(b.dmg, this, b.sx, { pierce: b.armorPiercing });
            b.dead = true; hit = true; break;
          }
        }
        if (!hit) {
          for (const pk of this.pickups) {
            if (pk.dead || pk.kind.indexOf('crate_') !== 0) continue;
            if (b.x > pk.x && b.x < pk.x + 14 && b.y > pk.y && b.y < pk.y + 14) {
              this.breakCrate(pk);
              if (b.explode) b.boom(this);
              b.dead = true; hit = true; break;
            }
          }
        }
        if (!hit) {
          for (const c of this.captives) {
            if (c.freed || c.gone) continue;
            if (b.x > c.x - 6 && b.x < c.x + 17 && b.y > c.y - 24 && b.y < c.y + 22) {
              this.freeCaptive(c); b.dead = true; hit = true; break;
            }
          }
        }
        if (!hit && this.boss && !this.boss.dead) {
          const bl = [];
          bl.push(b);
          if (this.boss.hitBullets(bl, this) && b.dead) hit = true;
        }
        if (b.dead) { this.bullets.splice(i, 1); }
      } else {
        // enemy bullets vs player
        if (p.state === 'normal' && !(this.vehicle.ridden && b.selfSafe)) {
          if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
            if (b.explode) {
              b.boom(this);
              if (dist2(b.x, b.y, p.cx, p.cy) < 40 * 40) p.damage(1, this, b.x);
            } else {
              p.damage(1, this, b.x);
              FX.hit(b.x, b.y, '#ff8060', 5);
              b.dead = true;
            }
          }
        }
        if (b.dead) this.bullets.splice(i, 1);
      }
    }
    // enemy grenades
    for (let i = this.grenades.length - 1; i >= 0; i--) {
      const g = this.grenades[i];
      g.update(dt, this);
      if (g.dead) { this.grenades.splice(i, 1); continue; }
      if (g.own === 'p' && p.state === 'normal' && dist2(g.x, g.y, p.cx, p.cy) < 7 * 7) {
        g.boom(this);
        this.grenades.splice(i, 1);
        continue;
      }
    }
    // lasers
    for (let i = this.lasers.length - 1; i >= 0; i--) {
      const l = this.lasers[i];
      l.update(dt, this);
      if (l.dead) { const e = this.enemies.find(x => x.laser === l); if (e) e.laser = null; this.lasers.splice(i, 1); }
    }
    // pickups
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const pk = this.pickups[i];
      pk.update(dt, this);
      if (pk.dead) { this.pickups.splice(i, 1); continue; }
      if (p.state === 'normal') {
        if (dist2(pk.cx, pk.cy, p.cx, p.cy + 8) < 15 * 15) this.collect(pk);
      }
      if (pk.kind === 'crate_cover' && dist2(pk.cx, pk.cy, p.cx, p.cy + 8) < 12 * 12) {
        this.breakCrate(pk);
      }
    }
    // captives
    for (const c of this.captives) {
      c.update(dt, this);
      if (!c.freed && p.state === 'normal' && dist2(c.cx, c.cy + 6, p.cx, p.cy) < 15 * 15) this.freeCaptive(c);
    }
    // vehicle
    if(p.state==='normal' && !cinematic)this.vehicle.update(dt, this);
    // player in vehicle
    if (this.vehicle.ridden && p.state==='normal') {
      p.x = this.vehicle.x + 4;
      p.y = this.vehicle.y - 6;
      p.vx = 0; p.vy = 0; p.anim = 'crouch';
      p.frame = 0;
      if (p.state === 'normal' && !this.vehicle.dead) {
        // player takes less damage in vehicle
      }
    }
    // shockwaves
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      const s = this.shockwaves[i];
      s.t += dt;
      s.x += s.vx * dt;
      if (s.t > s.life) { this.shockwaves.splice(i, 1); continue; }
      if (p.state === 'normal' && dist2(s.x, s.y + 8, p.cx, p.cy) < 14 * 14 && p.onGround) {
        p.damage(1, this, s.x);
        s.vx *= 0.4;
      }
      if (chance(0.6)) FX.dust(s.x, s.y + 6, 1, 'rgba(200,190,160,0.6)');
    }
    // boss beams
    for (let i = this.bossBeams.length - 1; i >= 0; i--) {
      const b = this.bossBeams[i];
      b.t += dt;
      if (b.t > b.life) { this.bossBeams.splice(i, 1); continue; }
      if (p.state === 'normal' && p.x < b.x && p.y < b.y + 6 && p.y + p.h > b.y - b.h) this.damagePlayer(1);
      if (chance(0.8)) emit({ x: b.x - rnd(0, 30), y: b.y + rnd(-8, 8), vx: -rnd(40, 120), vy: rnd(-20, 20), life: 0.3, kind: 'spark', col: '#ff5040', size: 3 });
    }
    // boss
    if (this.boss) this.boss.update(dt, this);
    // particles
    updateParticles(dt, this);
    // messages
    for (let i = this.messages.length - 1; i >= 0; i--) {
      this.messages[i].t += dt;
      if (this.messages[i].t > this.messages[i].life) this.messages.splice(i, 1);
    }
    for (let i = this.prompts.length - 1; i >= 0; i--) {
      this.prompts[i].t += dt;
      if (this.prompts[i].t > this.prompts[i].life) this.prompts.splice(i, 1);
    }
    // ambient
    this.updateAmbient(dt);
    // despawn anything well off-screen (keeping the jeep and boss support alive)
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.dead || e.type === 'jeep') continue;
      if (e.x < this.camX - 160 || e.x > this.camX + VW + 320) e.dead = true;
    }
  }
  updateAmbient(dt) {
    const camX = this.camX, camY = this.camY;
    // birds
    for (const b of Level.birds) {
      b.x += b.dir * b.sp * dt;
      if (b.x < camX - 60) b.x = camX + VW + 40;
      if (b.x > camX + VW + 60) b.x = camX - 50;
      b.f += dt * 8;
    }
    for (const s of Level.smokes) {
      s.t += dt;
      s.x += 5 * dt;
      s.y += s.sp * dt;
      if (s.t > 6) { s.t = 0; s.x = camX + rnd(0, VW * 1.4); s.y = Level.groundYAt(clamp(s.x, 0, Level.W * TILE - 2)) - rnd(20, 120); }
    }
    // ambient particles from the visible field only
    if (chance(dt * 8)) {
      const z = Level.zoneAtPx(camX + rnd(0, VW));
      FX.smokeTrail(camX + rnd(0, VW), camY + rnd(40, 200), 'rgba(120,110,100,0.25)', 3);
    }
  }
  updateHUDState(dt) { }

  /* ================= DRAW ================= */
  draw(c) {
    const camX = Math.round(this.camX + G.camShakeX);
    const camY = Math.round(this.camY + G.camShakeY);
    // background in screen space (parallax layers handle their own offsets)
    BG.draw(c, camX, camY, G.time);
    c.save();
    c.translate(-Math.floor(camX), -Math.floor(camY));
    this.drawTiles(c, camX, camY);
    this.drawProps(c, camX, camY);
    c.restore();
    this.drawAmbient(c, camX, camY);
    c.save();
    c.translate(-camX, -camY);
    for(const point of Level.checkpoints){
      const saved=point.x<=this.checkpoint.x && this.checkpoint.set;
      const col=saved?'#60f0cf':'#c8a86c';
      R(c,point.x,point.y-36,3,36,'#292737');
      R(c,point.x+3,point.y-35,22,13,'#242534');
      R(c,point.x+5,point.y-33,18,9,col);
      text(c,saved?'OK':'CP',point.x+14,point.y-32,'#15262a',1,'c');
      R(c,point.x-4,point.y-2,12,2,'#968c78');
    }
    // entities
    for (const pk of this.pickups) pk.draw(c, 0, 0);
    for (const cap of this.captives) cap.draw(c, 0, 0);
    for (const e of this.enemies) e.draw(c, 0, 0);
    for (const cp of this.corpses) cp.draw(c, 0, 0);
    if (this.vehicle.active && (!this.vehicle.ridden)) this.vehicle.draw(c, 0, 0);
    if (this.boss) this.boss.draw(c, 0, 0);
    if (this.player.state !== 'normal' || !this.vehicle.ridden) this.player.draw(c, 0, 0);
    if (this.vehicle.ridden && this.vehicle.active) this.vehicle.draw(c, 0, 0);
    // bullets & fx
    for (const l of this.lasers) l.draw(c, 0, 0);
    for (const b of this.bullets) b.draw(c, 0, 0);
    for (const g of this.grenades) g.draw(c, 0, 0);
    this.drawShockwaves(c, 0, 0);
    this.drawBossBeams(c, 0, 0);
    drawParticles(c);
    c.restore();
    BG.fore(c, camX, camY, G.time);
    this.drawHUD(c);
  }

  drawTiles(c, camX, camY) {
    const x0 = Math.max(0, Math.floor(camX / TILE) - 1);
    const x1 = Math.min(Level.W - 1, Math.floor((camX + VW) / TILE) + 1);
    const y0 = Math.max(0, Math.floor(camY / TILE) - 1);
    const y1 = Math.min(Level.H - 1, Math.floor((camY + VH) / TILE) + 1);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const t = Level.grid[ty * Level.W + tx];
        if (t === T_EMPTY) continue;
        const px = tx * TILE, py = ty * TILE;
        if (t === T_LADDER) { c.drawImage(ladderSprite(), px, py); continue; }
        if (t === T_PLAT) { c.drawImage(platformSprite(ty % 2 ? 'wood' : 'metal'), px, py); continue; }
        if (t === T_SPIKE) {
          // spikes drawn over background
          const above = ty > 0 ? Level.grid[(ty - 1) * Level.W + tx] : T_EMPTY;
