          if (above === T_EMPTY) {
            c.save();
            c.fillStyle = '#141018';
            for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(px + i * 4, py + 14); c.lineTo(px + i * 4 + 2, py + 2); c.lineTo(px + i * 4 + 4, py + 14); c.closePath(); c.fill(); }
            c.fillStyle = '#c0c4cc';
            for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(px + i * 4, py + 14); c.lineTo(px + i * 4 + 2, py + 3); c.lineTo(px + i * 4 + 2.6, py + 12); c.closePath(); c.fill(); }
            c.restore();
          }
          continue;
        }
        // solid
        const zone = Level.zoneAt[tx];
        const type = ZONES[zone] ? ZONES[zone].ground : 'sand';
        const above = ty > 0 ? Level.grid[(ty - 1) * Level.W + tx] : T_EMPTY;
        const cap = above !== T_SOLID && above !== T_PLAT;
        const v = (Math.floor(hash2(tx, ty * 3) * 3)) | 0;
        c.drawImage(tileSprite(type, v, cap), px, py);
        // depth shading: darken deeper rows so the mass reads as solid
        const depth = ty - Level.groundY[tx];
        if (depth > 0) {
          const k = Math.min(0.55, depth * 0.075);
          c.fillStyle = 'rgba(12,8,20,' + k.toFixed(3) + ')';
          c.fillRect(px, py, TILE, TILE);
        }
      }
    }
    // surface highlight line for a crisp silhouette
    c.save();
    c.globalAlpha = 0.25;
    c.fillStyle = '#ffffff';
    for (let tx = x0; tx <= x1; tx++) {
      const gy = Level.groundY[tx];
      const above = gy > 0 ? Level.grid[(gy - 1) * Level.W + tx] : T_EMPTY;
      if (above === T_EMPTY && gy >= y0 && gy <= y1) c.fillRect(tx * TILE, gy * TILE, TILE, 1);
    }
    c.restore();
  }

  drawProps(c, camX, camY) {
    const x0 = camX - 40, x1 = camX + VW + 40;
    for(const pr of Level.props){
      if(pr.kind!=='facade'||pr.x>x1||pr.x+pr.w<x0)continue;
      const c0=pr.z===1?'#635b60':'#806348';
      R(c,pr.x,pr.y,pr.w,pr.h,c0);
      R(c,pr.x+2,pr.y+3,pr.w-4,4,'#9b8980');
      for(let yy=pr.y+14;yy<pr.y+pr.h-28;yy+=24)for(let xx=pr.x+12;xx<pr.x+pr.w-12;xx+=28){
        R(c,xx,yy,13,16,'#282734');R(c,xx+2,yy+2,9,10,'#424452');R(c,xx-1,yy+15,16,3,'#92827a');
      }
      for(let xx=pr.x+24;xx<pr.x+pr.w-24;xx+=56){
        R(c,xx,pr.y+pr.h-30,22,30,'#292630');R(c,xx+2,pr.y+pr.h-28,18,28,'#3b333a');
      }
      for(let i=0;i<pr.w;i+=16)c.drawImage(platformSprite('metal'),pr.x+i,pr.y);
    }
    for (const pr of Level.props) {
      if (pr.x < x0 || pr.x > x1) continue;
      if (pr.kind === '_plat') continue;
      const y = pr.y;
      switch (pr.kind) {
        case 'ladder': {
          const h = pr.h || TILE;
          for (let i = 0; i < h; i += TILE) c.drawImage(ladderSprite(), pr.x, y + i);
          break;
        }
        case 'flag': {
          c.drawImage(flagProp(), pr.x, pr.y - flagProp().height);
          const cl = flagCloth(pr.zone || 0);
          const sway = Math.sin(G.time * 2.4 + pr.x * 0.05) * 2;
          c.save();
          c.translate(pr.x + 6, pr.y - flagProp().height + 1);
          c.drawImage(cl, Math.round(sway * 0.6), 0);
          c.restore();
          break;
        }
        case 'tyres': {
          c.drawImage(tyre(), pr.x, pr.y - 12); c.drawImage(tyre(), pr.x + 8, pr.y - 14);
          break;
        }
        case 'boulders': {
          for (let i = 0; i < 3; i++) {
            const bx = pr.x + i * 11, by = pr.y - (i === 1 ? 4 : 0);
            ellipseO(c, bx + 6, by - 6, 7, 6, { o: '#1a1418', c: i % 2 ? '#6a6058' : '#7a7068', h: '#9a9088', s: '#4a423c' });
          }
          break;
        }
        case 'roof': {
          for (let i = 0; i < pr.w; i += 48) c.drawImage(roofTile(), pr.x + i, pr.y - 14);
          break;
        }
        case 'window': {
          c.drawImage(windowFrame(), pr.x, pr.y);
          break;
        }
        default: {
          let spr = null;
          switch (pr.kind) {
            case 'sandbag': spr = sandbag(); break;
            case 'sandbagWall': spr = sandbagWall(); break;
            case 'crate': spr = crate(); break;
            case 'barrel': spr = barrel(); break;
            case 'barrelStack': spr = barrelStack(); break;
            case 'wreckCar': spr = wreckCar(); break;
            case 'cactus': spr = cactus(); break;
            case 'palm': spr = palm(); break;
            case 'rubble': spr = rubblePile(); break;
            case 'wallchunk': spr = wallChunk(); break;
            case 'balcony': spr = balcony(); break;
            case 'lamp': spr = lampPost(); break;
            case 'antenna': spr = antenna(); break;
            case 'sign': spr = signProp(); break;
            case 'bones': spr = bones(); break;
            case 'satellite': spr = satelliteDish(); break;
            case 'pipe': spr = pipeProp(); break;
            case 'fence': spr = fenceProp(); break;
            case 'tent': spr = tentProp(); break;
            case 'turretbase': spr = turretProp(); break;
            case 'drum': spr = drum(); break;
            case 'ammobox': spr = ammoBoxProp(); break;
            case 'street': spr = streetSign(); break;
            case 'girder': spr = girder(); break;
          }
          if (spr) c.drawImage(spr, pr.x, pr.kind === 'balcony' ? pr.y : pr.y - spr.height);
        }
      }
    }
  }

  drawAmbient(c, camX, camY) {
    // birds
    for (const b of Level.birds) {
      const x = b.x - camX, y = b.y - camY + Math.sin(b.f * 0.2) * 4;
      if (x < -20 || x > VW + 20) continue;
      c.save();
      c.globalAlpha = 0.5;
      c.translate(x, y); c.scale(b.dir, 1);
      c.drawImage(birdFrame(Math.floor(b.f) % 4), -6, -3);
      c.restore();
    }
    // smoke wisps
    for (const s of Level.smokes) {
      const x = s.x - camX, y = s.y - camY;
      if (x < -20 || x > VW + 20) continue;
      c.save();
      c.globalAlpha = 0.12 + 0.1 * Math.sin(s.t * 2);
      c.fillStyle = '#c8c0b0';
      const r = 3 + s.sc * 5;
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + 4, y - 3, r * 0.6, 0, TAU); c.fill();
      c.restore();
    }
  }

  drawShockwaves(c, camX, camY) {
    for (const s of this.shockwaves) {
      const k = s.t / s.life;
      c.save();
      c.globalAlpha = 1 - k;
      c.fillStyle = '#f0d8a0';
      const h = 12 - k * 8;
      c.fillRect(s.x - camX - 3, s.y - camY - h, 6, h);
      c.fillStyle = '#a08050';
      c.fillRect(s.x - camX - 5, s.y - camY - h * 0.4, 10, 3);
      c.restore();
    }
  }
  drawBossBeams(c, camX, camY) {
    for (const b of this.bossBeams) {
      const k = b.t / b.life;
      c.save();
      c.globalAlpha = clamp(1 - Math.abs(k - 0.5) * 2.2, 0, 1);
      const w = 300;
      c.fillStyle = '#ff3020';
      c.fillRect(b.x - camX - w, b.y - camY - b.h / 2, w, b.h);
      c.fillStyle = '#ffd060';
      c.fillRect(b.x - camX - w, b.y - camY - b.h / 4, w, b.h / 2);
      c.fillStyle = '#ffffff';
      c.fillRect(b.x - camX - w, b.y - camY - b.h / 8, w, b.h / 4);
      c.restore();
    }
  }

  /* ================= HUD ================= */
  drawHUD(c) {
    const p = this.player;
    // panel
    c.save();
    c.fillStyle = 'rgba(10,8,14,0.55)';
    c.fillRect(0, 0, VW, 30);
    c.fillStyle = 'rgba(255,255,255,0.08)';
    c.fillRect(0, 29, VW, 1);
    // score
    text(c, 'SCORE', 6, 4, '#8a90a0', 1);
    text(c, String(this.score).padStart(7, '0'), 6, 13, '#ffffff', 1);
    // lives: heart pips
    text(c, 'LIVES', 72, 4, '#8a90a0', 1);
    for (let i = 0; i < Math.max(0, Math.min(6, this.lives)); i++) heartIcon(c, 73 + i * 9, 14, 1);
    // health
    text(c, 'HP', 132, 4, '#8a90a0', 1);
    for (let i = 0; i < p.maxHp; i++) {
      const x = 132 + i * 7, y = 13;
      R(c, x, y, 6, 9, '#141018');
      R(c, x + 1, y + 1, 4, 7, i < p.hp ? '#e0402a' : '#38222a');
      if (i < p.hp) { R(c, x + 1, y + 1, 4, 2, '#ff7a58'); R(c, x + 1, y + 1, 1, 7, '#ff9a78'); }
    }
    // weapon slot
    const wp = WEAPONS[p.weapon];
    text(c, 'WEAPON', 170, 4, '#8a90a0', 1);
    R(c, 169, 12, 20, 15, 'rgba(255,255,255,0.10)');
    c.drawImage(weaponIcon(p.weapon), 170, 13);
    if (wp.ammo === Infinity) text(c, 'INF', 193, 17, '#60f0f0', 1);
    else text(c, String(p.ammo[p.weapon] | 0), 193, 17, p.ammo[p.weapon] <= 5 ? '#ff5040' : '#ffffff', 1);
    // grenades
    text(c, 'BOMB', 224, 4, '#8a90a0', 1);
    c.drawImage(pickupIcon('grenade'), 222, 12);
    text(c, String(p.grenades), 238, 17, p.grenades ? '#ffffff' : '#ff5040', 1);
    // captives
    text(c, 'POW', 266, 4, '#8a90a0', 1);
    text(c, this.rescued + '/' + this.totalCaptives, 266, 14, '#ffe060', 1);
    // score zone + boss bar
    const z = Level.zoneAtPx(this.camX + 10);
    text(c, z.name, VW - 6, 4, '#c0c8d8', 1, 'r');
    c.restore();

    // boss health bar
    if (this.boss && !this.boss.dead) {
      const b = this.boss;
      c.save();
      const bw = 240, bx = VW / 2 - bw / 2, by = VH - 34;
      c.fillStyle = 'rgba(10,8,14,0.7)'; c.fillRect(bx - 2, by - 2, bw + 4, 12);
      c.fillStyle = '#141018'; c.fillRect(bx, by, bw, 8);
      const frac = b.hp / b.maxHp;
      const col = frac > 0.5 ? '#e04a2a' : frac > 0.25 ? '#ff8020' : '#ff3020';
      R(c, bx, by, bw * frac, 8, col);
      R(c, bx, by, bw * frac, 3, '#ff9060');
      // phase separators
      c.fillStyle = '#141018';
      c.fillRect(bx + bw * 0.3, by, 2, 8);
      c.fillRect(bx + bw * 0.62, by, 2, 8);
      // part pips
      for (let i = 0; i < 3; i++) {
        const p2 = [b.parts.cannon, b.parts.pod, b.parts.core][i];
        if (p2.hidden) continue;
        const px = bx + bw * (0.15 + i * 0.3);
        c.fillStyle = p2.broken ? '#403030' : '#ffd040';
        c.fillRect(px - 2, by - 4, 4, 3);
      }
      text(c, 'IRON MAW', VW / 2, by - 12, '#ffd040', 1, 'c');
      c.restore();
    }
    // vehicle health
    if (this.vehicle.ridden && this.vehicle.active) {
      const v = this.vehicle;
      c.save();
      const bw = 80, bx = VW / 2 - bw / 2, by = 26;
      c.fillStyle = 'rgba(10,8,14,0.6)'; c.fillRect(bx - 2, by - 2, bw + 4, 10);
      R(c, bx, by, bw * clamp(v.hp / v.maxHp, 0, 1), 6, '#5fc04a');
      R(c, bx, by, bw * clamp(v.hp / v.maxHp, 0, 1), 2, '#a0e080');
      text(c, 'IRON HARE', VW / 2, by - 10, '#a0e0ff', 1, 'c');
      c.restore();
    }
    // messages
    for (let i = 0; i < this.messages.length; i++) {
      const m = this.messages[i];
      const k = m.t / m.life;
      const a = k < 0.1 ? k / 0.1 : k > 0.8 ? (1 - k) / 0.2 : 1;
      c.save();
      c.globalAlpha = clamp(a, 0, 1);
      const y = 46 + i * 14;
      text(c, m.txt, VW / 2, y, m.col, 1, 'c');
      c.restore();
    }
    if(this.waveActive){
      const remaining=this.waveActive.queue.length+this.waveActive.list.filter(e=>!e.dead).length;
      text(c,'HOLD POSITION  '+remaining+' HOSTILES  >',VW-8,VH-12,'#ffcf80',1,'r');
    }
    // prompts
    for (const pr of this.prompts) {
      const bob = Math.sin(G.time * 8) * 1;
      text(c, pr.txt, pr.x - this.camX, pr.y - this.camY + bob, '#ffffff', 1, 'c');
    }
    // GO! arrow
    if (!this.waveActive && !this.boss && this.player.state === 'normal' && this.goT > 0.2) {
      const a = 0.5 + 0.5 * Math.sin(G.time * 8);
      c.save();
      c.globalAlpha = a;
      const x = this.player.cx - this.camX + 24, y = this.player.y - this.camY - 12;
      c.fillStyle = '#ffe060';
      c.beginPath();
      c.moveTo(x, y); c.lineTo(x + 12, y - 7); c.lineTo(x + 12, y + 7);
      c.closePath(); c.fill();
      c.strokeStyle = '#141018'; c.lineWidth = 1; c.stroke();
      text(c, 'GO!', x + 20, y - 4, '#ffe060', 1);
      c.restore();
    }
    // low ammo / weapon flash
    if (p.weapon !== 'pistol' && (p.ammo[p.weapon] | 0) === 0) {
      c.save(); c.globalAlpha = 0.6 + 0.4 * Math.sin(G.time * 6);
      text(c, 'OUT OF AMMO - USE PISTOL', VW / 2, 36, '#ff5040', 1, 'c');
      c.restore();
    }
    // rescue / secret notifications
    if (this.rescued > 0 && this.showRescued === undefined && this.time < 3) { this.showRescued = this.rescued; }
  }
}

/* tiny 9x8 heart pip for the lives display */
function heartIcon(c, x, y, filled) {
  const px = (a, b, w, h, col) => R(c, x + a, y + b, w, h, col);
  const o = '#141018';
  const body = filled ? '#e04a5a' : '#3a2a34';
  const hi = filled ? '#ff8a90' : '#4a3a44';
  const lo = filled ? '#8a2030' : '#2a1e24';
  // outline silhouette
  const shape = [[1, 2, 2, 1], [6, 2, 2, 1], [0, 3, 9, 3], [1, 6, 7, 1], [2, 7, 5, 1], [3, 8, 3, 1]];
  for (const s of shape) px(s[0] - 0, s[1] - 0, s[2] + 2, s[3] + 2, o);
  for (const s of shape) px(s[0], s[1], s[2], s[3], body);
  px(2, 3, 2, 1, hi);
  px(1, 6, 7, 1, lo);
}

/* segment vs AABB (for laser beams) */
function segRect(x0, y0, x1, y1, rx, ry, rw, rh) {
  const steps = 26;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return true;
  }
  return false;
}

/* ============================================================
   15 - SCENES: title, pause, game over, level complete
   ============================================================ */

G.scenes.title = {
  t: 0, camX: 0, demo: 0, world: null,
  enter() {
    this.t = 0; this.demo = 0;
    Audio_.playMusic('title');
  },
  update(dt) {
    this.t += dt;
    this.demo += dt;
    this.camX += 22 * dt;
    if (this.camX > Level.W * TILE - VW) this.camX = 0;
    if (hit('start') || hit('fire') || hit('jump')) {
      SFX('confirm');
      Audio_.unlock();
      G.score = 0; G.lives = 3;
      G.scenes.game.world = null;
      Scene.set('game');
      return;
    }
    if (hit('mute')) { G.muted = !G.muted; Audio_.setMuted(G.muted); }
  },
  draw(c) {
    const camX = Math.floor(this.camX), camY = 0;
    BG.draw(c, camX, 0, this.demo);
    c.save();
    c.translate(-camX, 0);
    this.drawDemoTiles(c, camX);
    c.restore();
    BG.fore(c, camX, 0, this.demo);
    // darken for the logo
    c.fillStyle = 'rgba(8,6,12,0.45)';
    c.fillRect(0, 0, VW, VH);
    // logo
    const bounce = Math.sin(this.t * 2.2) * 2;
    const t2 = this.t;
    // sun burst rays
    c.save();
    c.globalAlpha = 0.10;
    c.translate(VW / 2, 78);
    c.rotate(t2 * 0.15);
    for (let i = 0; i < 12; i++) {
      c.rotate(TAU / 12);
      c.fillStyle = i % 2 ? '#ffd060' : '#ff8040';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(300, -26); c.lineTo(300, 26); c.closePath(); c.fill();
    }
    c.restore();
    // shadow plate
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = '#1a0c14';
    c.fillRect(0, 52, VW, 58);
    c.restore();
    // title
    const big = 4;
    text(c, 'OPERATION', VW / 2, 58 + bounce, '#ff5030', big, 'c');
    text(c, 'OPERATION', VW / 2, 56 + bounce, '#ffe060', big, 'c');
    text(c, 'SANDSTORM', VW / 2, 86 + bounce, '#ff5030', big, 'c');
    text(c, 'SANDSTORM', VW / 2, 84 + bounce, '#ffffff', big, 'c');
    text(c, 'A RUN-AND-GUN BLOODBATH', VW / 2, 114, '#c0c8d8', 1, 'c');

    // hero mascot
    const hx = VW / 2, hy = 176;
    const spr = fighterFrame('hero', this.t % 2 < 1 ? 'idle' : 'salute', Math.floor(this.t * 8) % 4, 'pistol', {});
    drawSpr(c, spr, hx, hy, 1, 0);
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.2 + 0.1 * Math.sin(this.t * 5);
    c.fillStyle = '#ff8040';
    c.fillRect(hx - 16, hy - 34, 32, 34);
    c.restore();
    // muzzle blink
    if (this.t % 2 < 0.08) {
      c.save();
      c.translate(hx + 12, hy - 20);
      c.globalAlpha = 0.9;
      c.drawImage(muzzleFlash(), 0, -9);
      c.restore();
    }

    // press start
    if (this.t > 0.6 && (this.t % 1.1) < 0.7) {
      text(c, 'PRESS  START', VW / 2, 200, '#ffffff', 2, 'c');
    }
    text(c, Touch.active ? 'TAP TO START' : 'PRESS ENTER OR Z', VW / 2, 218, '#9aa2b4', 1, 'c');
    // controls
    c.fillStyle = 'rgba(8,6,12,0.6)';
    c.fillRect(0, VH - 40, VW, 40);
    text(c, 'MOVE/ AIM: ARROWS OR WASD', 8, VH - 35, '#8a90a0', 1);
    text(c, 'JUMP: SPACE    FIRE: Z / J', 8, VH - 26, '#8a90a0', 1);
    text(c, 'GRENADE: X    KNIFE: C', 8, VH - 17, '#8a90a0', 1);
    text(c, 'PAUSE: ESC    MUTE: M', 8, VH - 8, '#8a90a0', 1);
    text(c, 'GAMEPAD + TOUCH SUPPORTED', VW - 8, VH - 35, '#8a90a0', 1, 'r');
    text(c, 'HIGH SCORE ' + String(Math.max(G.score, 0)).padStart(7, '0'), VW - 8, VH - 8, '#ffe060', 1, 'r');
    if (G.muted) text(c, 'SOUND OFF (M)', VW - 8, VH - 26, '#ff5040', 1, 'r');
    if (G.fps) text(c, Math.round(G.fps) + ' FPS', 4, VH - 48, 'rgba(255,255,255,0.25)', 1);
  },
  drawDemoTiles(c, camX) {
    const x0 = Math.max(0, Math.floor(camX / TILE) - 1);
    const x1 = Math.min(Level.W - 1, Math.floor((camX + VW) / TILE) + 1);
    for (let tx = x0; tx <= x1; tx++) {
      const ty = Level.groundY[tx];
      const type = ZONES[Level.zoneAt[tx]].ground;
      for (let y = ty; y < Level.H; y++) {
        c.drawImage(tileSprite(type, (hash2(tx, y * 3) * 3) | 0, y === ty), tx * TILE, y * TILE);
      }
    }
    // scattered silhouette props for depth
    for (const pr of Level.props) {
      if (pr.x < camX - 60 || pr.x > camX + VW + 60) continue;
      if (pr.kind === 'flag' || pr.kind === 'ladder' || pr.kind === '_plat') continue;
      const spr = { palm: palm, cactus: cactus, wreckCar: wreckCar, sandbagWall: sandbagWall, rubble: rubblePile, sign: signProp, street: streetSign, tent: tentProp, bones: bones, lamp: lampPost }[pr.kind];
      if (spr) { const img = spr(); c.drawImage(img, pr.x, pr.y - img.height); }
    }
  },
};

G.scenes.game = {
  world: null,
  enter() {
    Audio_.unlock();
    if (!this.world) this.world = new World(true);

    this.world.active = true;
    Audio_.playMusic(this.world.boss && !this.world.boss.dead ? 'boss' : 'action');
  },
  exit() { },
  update(dt) {
    if (this.world.active) this.world.update(dt);
  },
  draw() {
    if (this.world) this.world.draw(vctx);
  },
};

G.scenes.pause = {
  world: null, t: 0, sel: 0,
  enter() { Audio_.playMusic(null); this.t = 0; this.sel = 0; },
  update(dt) {
    this.t += dt;
    if (hit('pause') || hit('start')) { SFX('blip'); Scene.set('game'); return; }
    if (hit('down')) { this.sel = (this.sel + 1) % 4; SFX('blip'); }
    if (hit('up')) { this.sel = (this.sel + 3) % 4; SFX('blip'); }
    if (hit('left') || hit('right')) { this.sel = (this.sel + 1) % 4; SFX('blip'); }
    if (hit('mute')) { G.muted = !G.muted; Audio_.setMuted(G.muted); }
    if (hit('jump') || hit('fire')) {
      SFX('confirm');
      if (this.sel === 0) { Scene.set('game'); }
      else if (this.sel === 1) { G.scenes.game.world = null; Scene.set('game'); }
      else if (this.sel === 2) { G.muted = !G.muted; Audio_.setMuted(G.muted); }
      else { Audio_.playMusic('title'); Scene.set('title'); }
    }
  },
  draw() {
    const w = G.scenes.game.world;
    if (w) w.draw(vctx);
    c2d().fillStyle = 'rgba(6,4,10,0.65)';
    c2d().fillRect(0, 0, VW, VH);
    text(vctx, 'PAUSED', VW / 2, 80, '#ffffff', 3, 'c');
    const items = ['RESUME', 'RESTART LEVEL', 'SOUND: ' + (G.muted ? 'OFF' : 'ON'), 'QUIT TO TITLE'];
    for (let i = 0; i < items.length; i++) {
      const y = 130 + i * 18;
      const on = i === this.sel;
      if (on) {
        vctx.fillStyle = 'rgba(255,224,96,0.15)';
        vctx.fillRect(VW / 2 - 90, y - 4, 180, 14);
        text(vctx, '>', VW / 2 - 84, y, '#ffe060', 1);
      }
      text(vctx, items[i], VW / 2, y, on ? '#ffe060' : '#a0a8b8', 1, 'c');
    }
    text(vctx, 'ARROWS + Z / SPACE', VW / 2, VH - 20, '#6a7080', 1, 'c');
  },
};

G.scenes.gameover = {
  t: 0, count: 10, world: null, lastBeep: 99,
  enter(arg) {
    this.t = 0; this.count = 10; this.world = arg;
    this.lastBeep = 99;
    Audio_.stopMusic();
    SFX('gameOver');
  },
  update(dt) {
    this.t += dt;
    const c = Math.ceil(10 - this.t);
    if (c !== this.lastBeep && c >= 0) { this.lastBeep = c; SFX('beep', { v: c <= 3 ? 1 : 0.6 }); }
    if (this.t > 10.2) { G.scenes.game.world = null; Scene.set('title'); return; }
    if (hit('start') || hit('fire') || hit('jump')) {
      SFX('confirm');
      G.lives = 3;
      G.scenes.game.world = null;
      Scene.set('game');
    }
  },
  draw() {
    if (this.world) this.world.draw(vctx);
    const c2 = c2d();
    c2.fillStyle = 'rgba(10,2,4,0.72)';
    c2.fillRect(0, 0, VW, VH);
    const bob = Math.sin(this.t * 3) * 1.5;
    text(vctx, 'GAME OVER', VW / 2, 88 + bob, '#c02a1a', 4, 'c');
    text(vctx, 'GAME OVER', VW / 2, 86 + bob, '#ff5030', 4, 'c');
    text(vctx, 'SCORE  ' + String(this.world ? this.world.score : 0).padStart(7, '0'), VW / 2, 126, '#ffffff', 2, 'c');
    text(vctx, 'POW RESCUED  ' + (this.world ? this.world.rescued + '/' + this.world.totalCaptives : '0/0'), VW / 2, 148, '#ffe060', 1, 'c');
    const left = Math.max(0, 10 - this.t);
    text(vctx, 'CONTINUE?  ' + Math.ceil(left), VW / 2, 172, left < 3.5 ? '#ff4030' : '#ffffff', 2, 'c');
    if (this.t < 10 && (this.t % 1 < 0.55)) text(vctx, 'PRESS START', VW / 2, 196, '#ffffff', 1, 'c');
  },
};

G.scenes.complete = {
  tally: null, t: 0, step: 0, shown: 0,
  enter(tally) {
    this.tally = tally || { score: 0, rescued: 0, total: 0, lives: 0, time: 0 };
    this.t = 0; this.step = 0; this.shown = 0;
    Audio_.playMusic('action');
    SFX('levelClear');
    G.credits++;
  },
  update(dt) {
    this.t += dt;
    const T = this.tally;
    const bonusP = T.rescued * 1000;
    const secretP = T.rescued >= 3 ? T.rescued * 500 : 0;
    const lifeP = T.lives * 2000;
    this.total = T.score + bonusP + secretP + lifeP;
    if (this.t > 0.4 && this.step === 0) { this.step = 1; SFX('beep'); }
    if (this.t > 1.1 && this.step === 1) { this.step = 2; SFX('beep'); }
    if (this.t > 1.6 && this.step === 2) { this.step = 3; SFX('beep'); }
    if (this.t > 2.1 && this.step === 3) { this.step = 4; SFX('coin'); }
    this.shown = lerp(this.shown, this.total, 0.08);
    if (this.t > 3.2 && (hit('start') || hit('fire') || hit('jump'))) {
      SFX('confirm');
      G.scenes.game.world = null;
      Scene.set('title');
    }
  },
  draw() {
    const T = this.tally, c2 = c2d();
    const t = this.t;
    // celebration background
    c2.fillStyle = '#0a0812'; c2.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 60; i++) {
      const x = hash2(i, 3) * VW, y = ((hash2(i, 5) * VH) + t * (20 + hash2(i, 7) * 60)) % (VH + 20);
      c2.fillStyle = ['#ffe060', '#ff6030', '#60f0f0', '#ff90c0'][i % 4];
      c2.fillRect(x | 0, (y - 10) | 0, 2, 4);
    }
    text(vctx, 'MISSION COMPLETE!', VW / 2, 24, '#ffd040', 2, 'c');
    text(vctx, 'OPERATION SANDSTORM - ZONE CLEARED', VW / 2, 44, '#c0c8d8', 1, 'c');
    // hero victory pose
    const spr = fighterFrame('hero', 'victory', Math.floor(t * 8) % 4, 'none', {});
    drawSpr(vctx, spr, VW / 2, VH - 44, 1, 0);
    const rows = [
      ['SCORE', T.score, this.step >= 0],
      ['POW RESCUED  ' + T.rescued + '/' + T.total, T.rescued * 1000, this.step >= 1],
      ['SECRET AREAS', T.rescued >= 3 ? T.rescued * 500 : 0, this.step >= 2],
      ['LIVES BONUS  ' + T.lives, T.lives * 2000, this.step >= 2],
    ];
    let y = 70;
    for (const [label, val, show] of rows) {
      if (!show) continue;
      text(vctx, label, 80, y, '#a0a8b8', 1);
      text(vctx, String(val), 400, y, '#ffffff', 1, 'r');
      y += 14;
    }
    text(vctx, 'TOTAL', 80, y + 6, '#ffe060', 2);
    text(vctx, String(Math.floor(this.shown)), 400, y + 6, '#ffe060', 2, 'r');
    // rank
    if (this.step >= 4) {
      const rank = this.total > 90000 ? 'S' : this.total > 60000 ? 'A' : this.total > 35000 ? 'B' : 'C';
      const pulse = 1 + 0.12 * Math.sin(t * 6);
      c2.save();
      c2.translate(VW - 56, 96);
      c2.scale(pulse, pulse);
      text(vctx, 'RANK', 0, -14, '#a0a8b8', 1, 'c');
      text(vctx, rank, 0, -2, rank === 'S' ? '#ffd040' : rank === 'A' ? '#60f0f0' : '#c0c8d8', 4, 'c');
      c2.restore();
    }
    if (this.step >= 4 && (t % 1.1) < 0.7) text(vctx, 'PRESS START', VW / 2, VH - 22, '#ffffff', 1, 'c');
  },
};

function c2d() { return vctx; }

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  Level.build();
  // build a few hot sprites up-front to avoid hitches
  tileSprite('sand', 0, true);
  crate(); sandbagWall(); wreckCar(); cactus(); palm();
  explosionSprite(0); explosionSprite(1); explosionSprite(2);
  fighterFrame('hero', 'idle', 0, 'pistol', {});
  tankBody();
  setupTouch();
  resize();
  Scene.set('title');
  requestAnimationFrame(frame);
  // audio needs a user gesture on most browsers
  const unlock = () => { Audio_.unlock(); if (G.scenes.title) Audio_.playMusic('title'); };
  addEventListener('pointerdown', unlock, { once: true });
  addEventListener('keydown', unlock, { once: true });
  addEventListener('touchstart', unlock, { once: true });
  document.body.addEventListener('click', unlock, { once: true });
  window.__gameReady = true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();


</script>
