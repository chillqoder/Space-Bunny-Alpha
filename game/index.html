<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OPERATION SANDSTORM - a procedural run-and-gun</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060c; color: #cfc8d8;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 2px #241c2c, 0 0 40px rgba(0,0,0,0.8);
    background: #000;
  }
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 20; }
  .tbtn {
    position: absolute; pointer-events: auto;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    color: rgba(255,255,255,0.8);
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .tbtn.on { background: rgba(255,220,100,0.35); border-color: #ffe060; color: #fff; }
  #hint {
    position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%);
    font-size: 11px; color: #55506a; letter-spacing: 1px; z-index: 5; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<div id="hint">ARROWS MOVE &nbsp;|&nbsp; SPACE JUMP &nbsp;|&nbsp; Z FIRE &nbsp;|&nbsp; X GRENADE &nbsp;|&nbsp; C KNIFE &nbsp;|&nbsp; V SHIELD &nbsp;|&nbsp; ESC PAUSE &nbsp;|&nbsp; M MUTE</div>
<script>
/* ============================================================
   SPACE BUNNIES: OPERATION SANDSTORM
   A fully procedural run-and-gun. No external assets.
   ============================================================ */
'use strict';

/* ---------------- canvas / scaling ---------------- */
const VW = 480, VH = 270;          // internal resolution (pixel-art space)
const TILE = 16;
const view = document.getElementById('game');
const vctx = view.getContext('2d', { alpha: false });
vctx.imageSmoothingEnabled = false;

let scale = 1, offX = 0, offY = 0;
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / VW, wh / VH);
  // integer scale where possible for crunchy pixels, but allow half steps
  scale = s >= 1 ? Math.max(1, Math.floor(s * 2) / 2) : s;
  const w = Math.round(VW * scale), h = Math.round(VH * scale);
  view.width = w; view.height = h;
  view.style.width = w + 'px'; view.style.height = h + 'px';
  vctx.imageSmoothingEnabled = false;
  offX = 0; offY = 0;
  if (G.onResize) G.onResize();
}
window.addEventListener('resize', resize);

/* ---------------- math / utils ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const TAU = Math.PI * 2;
function angLerp(a, b, t) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

/* ---------------- input ---------------- */
const Keys = Object.create(null);
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyZ: 'fire', KeyJ: 'fire',
  KeyX: 'grenade', KeyK: 'grenade',
  KeyC: 'knife', KeyL: 'knife',
  KeyV: 'special', ShiftLeft: 'special', ShiftRight: 'special',
  Enter: 'start', NumpadEnter: 'start',
  Escape: 'pause', KeyP: 'pause',
  KeyM: 'mute',
  KeyR: 'restart',
};
const keyboardHeld = new Set();
const padHeld = Object.create(null);
function setInput(k) {
  const value = [...keyboardHeld].some(code => KEYMAP[code] === k) || !!padHeld[k] ||
    Object.values(Touch.pointers).includes(k);
  if (value && !Keys[k]) pressed[k] = true;
  if (!value && Keys[k]) released[k] = true;
  Keys[k] = value;
}
const pressed = Object.create(null);   // edge
const released = Object.create(null);
const PAD = { axes: 0, buttons: [], prev: [], idx: -1 };

function keyName(e) {
  if (KEYMAP[e.code]) return KEYMAP[e.code];
  if (e.key === ' ') return 'jump';
  return null;
}
addEventListener('keydown', e => {
  const k = keyName(e);
  if (k) {
    keyboardHeld.add(e.code || (k === 'jump' ? 'Space' : e.key));
    setInput(k);
    e.preventDefault();
  }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
  Audio_.unlock();
});
addEventListener('keyup', e => {
  const k = keyName(e);
  if (k) { keyboardHeld.delete(e.code || (k === 'jump' ? 'Space' : e.key)); setInput(k); }
});
addEventListener('blur', () => {
  keyboardHeld.clear(); Touch.pointers = {};
  for (const k in padHeld) padHeld[k] = false;
  for (const b of Object.values(Touch.btns)) b.el.classList.remove('on');
  for (const k in Keys) Keys[k] = false;
  clearEdges();
});

// gamepad polling folded into input update
function updatePad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = [...gps].find(g => g && g.connected);
  const next = Object.create(null);
  if (gp) {
    const b = i => !!gp.buttons[i]?.pressed;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    next.left = ax < -0.35 || b(14); next.right = ax > 0.35 || b(15);
    next.up = ay < -0.35 || b(12); next.down = ay > 0.35 || b(13);
    next.jump = b(0); next.fire = b(2) || b(7);
    next.grenade = b(3); next.knife = b(1);
    next.special = b(4) || b(5) || b(6);
    next.start = b(9) || b(8); next.pause = b(9);
    PAD.idx = gp.index; PAD.axes = ax;
  } else PAD.idx = -1;
  for (const k of new Set([...Object.keys(padHeld), ...Object.keys(next)])) {
    padHeld[k] = !!next[k]; setInput(k);
  }
}
function down(k) { return !!Keys[k]; }
function hit(k) { return !!pressed[k]; }
function clearEdges() { for (const k in pressed) pressed[k] = false; for (const k in released) released[k] = false; }

/* ---------------- touch controls ---------------- */
const Touch = { active: false, btns: {}, pointers: {} };
function setupTouch() {
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) return;
  const el = document.getElementById('touch');
  el.style.display = 'block';
  Touch.active = true;
  const layout = [
    { k: 'left', l: '◀', x: 12, y: 150, w: 62, h: 62 },
    { k: 'down', l: '▼', x: 80, y: 150, w: 62, h: 62 },
    { k: 'right', l: '▶', x: 148, y: 150, w: 62, h: 62 },
    { k: 'up', l: '▲', x: 80, y: 82, w: 62, h: 62 },
    { k: 'fire', l: 'FIRE', x: 268, y: 118, w: 86, h: 86 },
    { k: 'grenade', l: 'BOMB', x: 366, y: 150, w: 66, h: 54 },
    { k: 'jump', l: 'JUMP', x: 366, y: 40, w: 66, h: 54 },
    { k: 'knife', l: 'KNF', x: 268, y: 212, w: 86, h: 40 },
  ];
  for (const b of layout) {
    const d = document.createElement('div');
    d.className = 'tbtn'; d.textContent = b.l;
    d.style.left = b.x + 'px'; d.style.top = b.y + 'px';
    d.style.width = b.w + 'px'; d.style.height = b.h + 'px';
    el.appendChild(d);
    b.el = d; Touch.btns[b.k] = b;
  }
  // Keep controls inside the viewport in portrait and landscape.
  function layoutTouch() {
    const factor = Math.min(1, innerWidth / 480, innerHeight / 290);
    for (const b of Object.values(Touch.btns)) {
      b.el.style.left = (b.x / 480 * (innerWidth - 20) + 4) + 'px';
      b.el.style.top = (innerHeight - (270 - b.y) * factor - 12) + 'px';
      b.el.style.width = (b.w * factor) + 'px';
      b.el.style.height = (b.h * factor) + 'px';
    }
  }
  layoutTouch(); addEventListener('resize', layoutTouch);
  for (const [k, b] of Object.entries(Touch.btns)) {
    b.el.addEventListener('pointerdown', e => {
      e.preventDefault(); b.el.setPointerCapture(e.pointerId);
      Touch.pointers[e.pointerId] = k; setInput(k);
      b.el.classList.add('on'); Audio_.unlock();
    });
    const release = e => {
      delete Touch.pointers[e.pointerId]; setInput(k);
      b.el.classList.toggle('on', Object.values(Touch.pointers).includes(k));
    };
    b.el.addEventListener('pointerup', release);
    b.el.addEventListener('pointercancel', release);
    b.el.addEventListener('lostpointercapture', release);
  }
  view.addEventListener('pointerdown', () => { Audio_.unlock(); pressed.start = true; });

}

/* ---------------- global game state holder ---------------- */
const G = {
  scene: null, scenes: {}, time: 0, shake: 0, hitStop: 0,
  camX: 0, camY: 0, camShakeX: 0, camShakeY: 0,
  onResize: null,
  score: 0, lives: 3, credits: 0,
  muted: false,
  fps: 60, frames: 0, fpsTimer: 0,
};

/* ---------------- scene manager ---------------- */
const Scene = {
  set(name, arg) {
    if (G.scene && G.scene.exit) G.scene.exit();
    G.scene = G.scenes[name];
    G.scene.enter && G.scene.enter(arg);
  },
  update(dt) {
    updatePad();
    if (G.scene && G.scene.update) G.scene.update(dt);
    clearEdges();
  },
  draw() {
    vctx.save();
    vctx.setTransform(scale, 0, 0, scale, 0, 0);
    vctx.imageSmoothingEnabled = false;
    if (G.scene && G.scene.draw) G.scene.draw(vctx);
    vctx.restore();
  }
};

/* ---------------- main loop: fixed timestep ---------------- */
let last = 0, acc = 0;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;                    // guard against tab-switch spikes
  acc += dt;
  G.fpsTimer += dt; G.frames++;
  if (G.fpsTimer > 0.5) { G.fps = G.frames / G.fpsTimer; G.frames = 0; G.fpsTimer = 0; }
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    acc -= STEP; steps++;
    G.time += STEP;
    Audio_.update();
    if (G.hitStop > 0) { G.hitStop -= STEP; }
    else Scene.update(STEP);
    // camera shake decay
    if (G.shake > 0) {
      G.shake = Math.max(0, G.shake - STEP * 42);
      G.camShakeX = rnd(-G.shake, G.shake);
      G.camShakeY = rnd(-G.shake, G.shake) * 0.6;
    } else { G.camShakeX = 0; G.camShakeY = 0; }
  }
  if (steps === 5) acc = 0;
  Scene.draw();
}

/* ============================================================
   02 - PROCEDURAL PIXEL ART
   Everything here is drawn in code. Sprites are baked into
   offscreen canvases once, then blitted.
   ============================================================ */

/* ---------- tiny offscreen canvas helper ---------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}
const spriteCache = new Map();
function bake(key, w, h, fn) {
  let c = spriteCache.get(key);
  if (c) return c;
  c = makeCanvas(w, h);
  fn(c.getContext('2d'), c);
  c.__w = c.width; c.__h = c.height;
  spriteCache.set(key, c);
  return c;
}
function bakeTo(canvas, fn) { fn(canvas.getContext('2d'), canvas); return canvas; }

/* ---------- drawing primitives (outline-first, chunky) ---------- */
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); }
function RE(c, x, y, w, h, col) { // outlined rect
  R(c, x - 1, y - 1, w + 2, h + 2, col.o);
  R(c, x, y, w, h, col.c);
  if (col.h) R(c, x, y, w, 1, col.h);
  if (col.s) R(c, x, y + h - 1, w, 1, col.s);
}
function disc(c, cx, cy, r, col) {
  c.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(r * r - y * y));
    if (w >= 0) c.fillRect((cx - w) | 0, (cy + y) | 0, w * 2 + 1, 1);
  }
}
function ellipseO(c, cx, cy, rx, ry, col) {
  c.fillStyle = col.o;
  for (let y = -ry - 1; y <= ry + 1; y++) {
    const t = (y) / (ry + 1), w = Math.floor((rx + 1) * Math.sqrt(Math.max(0, 1 - t * t)));
    if (w >= 0) c.fillRect((cx - w) | 0, (cy + y) | 0, w * 2 + 1, 1);
  }
  c.fillStyle = col.c;
  for (let y = -ry; y <= ry; y++) {
    const t = (y) / (ry + 1), w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if (w >= 0) c.fillRect((cx - w) | 0, (cy + y) | 0, w * 2 + 1, 1);
  }
  c.fillStyle = col.h;
  for (let y = -ry; y < 0; y++) {
    const t = (y) / (ry + 1), w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if (w >= 0) c.fillRect((cx - w) | 0, (cy + y) | 0, w * 2, 1);
  }
  if (col.s) { c.fillStyle = col.s; for (let y = 0; y < ry; y++) { const t = y / (ry + 1), w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - t * t))); if (w >= 0) c.fillRect((cx - w) | 0, (cy + y) | 0, w * 2, 1); } }
}
function segO(c, x1, y1, x2, y2, w, col) {
  // outline
  c.strokeStyle = col.o; c.lineWidth = w + 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.strokeStyle = col.c; c.lineWidth = w;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  if (col.h) {
    c.strokeStyle = col.h; c.lineWidth = Math.max(1, w - 2);
    c.beginPath(); c.moveTo(x1 - .6, y1 - .6); c.lineTo(x2 - .6, y2 - .6); c.stroke();
  }
}
function polyO(c, pts, col) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath();
  c.strokeStyle = col.o; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
  c.fillStyle = col.c; c.fill();
  if (col.h) { c.fillStyle = col.h; c.fillRect(pts[0], pts[1], 1, 1); }
}
function lineO(c, x1, y1, x2, y2, col, w) {
  c.strokeStyle = col.o; c.lineWidth = (w || 1) + 1;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.strokeStyle = col.c; c.lineWidth = w || 1;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}

/* ---------- bitmap font (5x7) ---------- */
const FONT = {
  'A': '01110,10001,10001,11111,10001,10001,10001',
  'B': '11110,10001,10001,11110,10001,10001,11110',
  'C': '01110,10001,10000,10000,10000,10001,01110',
  'D': '11110,10001,10001,10001,10001,10001,11110',
  'E': '11111,10000,10000,11110,10000,10000,11111',
  'F': '11111,10000,10000,11110,10000,10000,10000',
  'G': '01110,10001,10000,10111,10001,10001,01111',
  'H': '10001,10001,10001,11111,10001,10001,10001',
  'I': '11111,00100,00100,00100,00100,00100,11111',
  'J': '00111,00010,00010,00010,00010,10010,01100',
  'K': '10001,10010,10100,11000,10100,10010,10001',
  'L': '10000,10000,10000,10000,10000,10000,11111',
  'M': '10001,11011,10101,10101,10001,10001,10001',
  'N': '10001,11001,10101,10011,10001,10001,10001',
  'O': '01110,10001,10001,10001,10001,10001,01110',
  'P': '11110,10001,10001,11110,10000,10000,10000',
  'Q': '01110,10001,10001,10001,10101,10010,01101',
  'R': '11110,10001,10001,11110,10100,10010,10001',
  'S': '01111,10000,10000,01110,00001,00001,11110',
  'T': '11111,00100,00100,00100,00100,00100,00100',
  'U': '10001,10001,10001,10001,10001,10001,01110',
  'V': '10001,10001,10001,10001,10001,01010,00100',
  'W': '10001,10001,10001,10101,10101,11011,01010',
  'X': '10001,10001,01010,00100,01010,10001,10001',
  'Y': '10001,10001,01010,00100,00100,00100,00100',
  'Z': '11111,00001,00010,00100,01000,10000,11111',
  '0': '01110,10001,10011,10101,11001,10001,01110',
  '1': '00100,01100,00100,00100,00100,00100,01110',
  '2': '01110,10001,00001,00010,00100,01000,11111',
  '3': '11111,00010,00100,00010,00001,10001,01110',
  '4': '00010,00110,01010,10010,11111,00010,00010',
  '5': '11111,10000,11110,00001,00001,10001,01110',
  '6': '00110,01000,10000,11110,10001,10001,01110',
  '7': '11111,00001,00010,00100,01000,01000,01000',
  '8': '01110,10001,10001,01110,10001,10001,01110',
  '9': '01110,10001,10001,01111,00001,00010,01100',
  ' ': '00000,00000,00000,00000,00000,00000,00000',
  '.': '00000,00000,00000,00000,00000,01100,01100',
  ',': '00000,00000,00000,00000,01100,00100,01000',
  '!': '00100,00100,00100,00100,00100,00000,00100',
  '?': '01110,10001,00001,00010,00100,00000,00100',
  ':': '00000,01100,01100,00000,01100,01100,00000',
  '-': '00000,00000,00000,01110,00000,00000,00000',
  '_': '00000,00000,00000,00000,00000,00000,11111',
  '+': '00000,00100,00100,11111,00100,00100,00000',
  '/': '00001,00010,00010,00100,01000,01000,10000',
  '\\': '10000,01000,01000,00100,00010,00010,00001',
  '(': '00010,00100,01000,01000,01000,00100,00010',
  ')': '01000,00100,00010,00010,00010,00100,01000',
  "'": '00100,00100,00000,00000,00000,00000,00000',
  '"': '01010,01010,00000,00000,00000,00000,00000',
  '*': '00000,10101,01110,11111,01110,10101,00000',
  '=': '00000,00000,11111,00000,11111,00000,00000',
  '<': '00010,00100,01000,10000,01000,00100,00010',
  '>': '01000,00100,00010,00001,00010,00100,01000',
  '%': '11001,11010,00010,00100,01000,01011,10011',
  '#': '01010,11111,01010,01010,11111,01010,00000',
  '&': '01100,10010,10100,01000,10101,10010,01101',
  '[': '01110,01000,01000,01000,01000,01000,01110',
  ']': '01110,00010,00010,00010,00010,00010,01110',
  '@': '01110,10001,10111,10101,10111,10000,01110',
};
const FONTW = 5, FONTH = 7;
const glyphCache = new Map();
function glyph(ch, col) {
  const key = ch + col;
  let g = glyphCache.get(key);
  if (g) return g;
  const data = FONT[ch] || FONT['?'];
  g = bake('f' + key, FONTW, FONTH, (c) => {
    const rows = data.split(',');
    c.fillStyle = col;
    for (let y = 0; y < 7; y++) {
      const r = rows[y];
      for (let x = 0; x < 5; x++) if (r[x] === '1') c.fillRect(x, y, 1, 1);
    }
  });
  glyphCache.set(key, g);
  return g;
}
function textW(str, s) { s = s || 1; return str.length * (FONTW + 1) * s - s; }
function text(c, str, x, y, col, s, align, shadow) {
  str = String(str).toUpperCase();
  s = s || 1;
  if (align === 'c') x -= textW(str, s) / 2;
  else if (align === 'r') x -= textW(str, s);
  x = Math.round(x); y = Math.round(y);
  if (shadow !== false) {
    const so = shadow || '#0b0a10';
    let sx = x, sy = y;
    // draw shadow by offsetting in screen space
    const pass = (col2, ox, oy) => {
      let cx = sx + ox, cy = sy + oy;
      for (let i = 0; i < str.length; i++) {
        const g = glyph(str[i], col2);
        c.drawImage(g, cx, cy, g.width * s, g.height * s);
        cx += (FONTW + 1) * s;
      }
    };
    pass(so, s, s);

const AW = 24, AH = 30, FEET = 28, HIPY = 16, SHY = 10, HEADY = 6;

/** Build one frame of a humanoid. pose = {lean, bob, headTilt, armF:[sh,el], armB:[sh,el], legF:[th,kn], legB:[th,kn], crouch, gun, gunFlip, aim} */
function drawFighter(c, pal, pose, opts) {

    const a1 = sh, a2 = sh + el;

  // ---- LEG: thigh then shin, angle 0 = straight down, + = forward

    const th = l[0], kn = l[1];
    const kx = hx + Math.sin(th) * thigh, ky = hy + Math.cos(th) * thigh;
    const fa = th - kn;
    const fx = kx + Math.sin(fa) * shin, fy = ky + Math.cos(fa) * shin;
    return [[hx, hy, kx, ky, fx, fy]];

    const boot = back ? { o: pal.o, c: shade(pal.boot, -16), h: shade(pal.boot, 6) } : BOOT(pal);
    segO(c, p[0], p[1], p[2], p[3], 3.4, col);
    segO(c, p[2], p[3], p[4], p[5], 3, col);

    R(c, p[4] - 2.5, p[5] - 1.5, 6, 4, boot.o);

  R(c, bHx - 1.5, bHy - 1.5, 3, 3, pal.o);

  run: (t, g) => {

  crouch: (t, g) => aimPose(0.12, {

const TILE_COLORS = {
  sand: { top: '#e8c477', top2: '#f2d896', body: '#c99a4e', body2: '#b3813c', line: '#8a5f28' },
  dirt: { top: '#a8794a', top2: '#bb8a56', body: '#8a5c34', body2: '#734a28', line: '#4f3018' },
  stone: { top: '#8a8296', top2: '#a49cb0', body: '#6b6478', body2: '#575061', line: '#3a3444' },
  metal: { top: '#7a8490', top2: '#96a0ac', body: '#59626d', body2: '#454d57', line: '#2b3138' },
  fort: { top: '#6a5a52', top2: '#85736a', body: '#4e423c', body2: '#3d332e', line: '#241d1a' },
  brick: { top: '#b0705a', top2: '#c88870', body: '#8e5646', body2: '#744436', line: '#4a2a20' },
  wood: { top: '#b08a52', top2: '#c8a268', body: '#8e6c3c', body2: '#6f5430', line: '#463420' },
};
function tileSprite(type, v, cap) {
  return bake('T|' + type + v + (cap ? 'c' : ''), TILE, TILE, (c) => {
    const p = TILE_COLORS[type] || TILE_COLORS.stone;
    R(c, 0, 0, TILE, TILE, p.body);
    // speckle texture
    for (let i = 0; i < 16; i++) {
      const r1 = hash2(v * 31 + i, i * 17), r2 = hash2(i * 7, v * 13 + 3), r3 = hash2(v + i * 5, i);
      if (r1 > 0.6) R(c, (r2 * TILE) | 0, (r3 * TILE) | 0, 1 + (r3 > 0.8 ? 1 : 0), 1, p.body2);
      else if (r1 < 0.16) R(c, (r2 * TILE) | 0, (r3 * TILE) | 0, 1, 1, p.line);
    }
    if (type === 'brick') {
      c.fillStyle = p.line;
      for (let y = 0; y < TILE; y += 5) c.fillRect(0, y, TILE, 1);
      for (let y = 0; y < TILE; y += 5) for (let x = ((y / 5) % 2) * 4; x < TILE; x += 8) c.fillRect(x, y, 1, 5);
    }
    if (type === 'metal') {
      c.fillStyle = p.line; c.fillRect(0, 0, TILE, 1);
      R(c, 1, 3, 14, 1, p.body2); R(c, 1, 9, 14, 1, p.body2);
      for (let x = 2; x < TILE; x += 4) { R(c, x, 2, 1, 1, p.top2); R(c, x, 8, 1, 1, p.top2); }
    }
    if (cap) {
      R(c, 0, 0, TILE, 3, p.top);
      R(c, 0, 0, TILE, 1, p.top2);
      c.fillStyle = p.line;
      for (let i = 0; i < TILE; i += 3) c.fillRect(i, 3, 1, 1);
    }
  });
}
function platformSprite(kind) {
  return bake('PL|' + kind, TILE, 8, (c) => {
    if (kind === 'wood') {
      R(c, 0, 0, TILE, 8, '#141018'); R(c, 0, 1, TILE, 5, '#a07840'); R(c, 0, 1, TILE, 2, '#c49a58');
      c.fillStyle = '#6b4f2c'; for (let x = 2; x < TILE; x += 5) c.fillRect(x, 1, 1, 5);
      c.fillStyle = '#4a3218'; c.fillRect(0, 6, TILE, 1);
    } else {
      R(c, 0, 0, TILE, 8, '#141018'); R(c, 0, 1, TILE, 5, '#6b7480'); R(c, 0, 1, TILE, 1, '#95a0ad');
      c.fillStyle = '#454d57'; for (let x = 1; x < TILE; x += 3) c.fillRect(x, 2, 2, 3);
      c.fillStyle = '#8a94a2'; R(c, 0, 1, 1, 5, '#8a94a2'); R(c, TILE - 1, 1, 1, 5, '#8a94a2');
    }
  });
}
function ladderSprite() {
  return bake('LAD', 12, TILE, (c) => {
    R(c, 0, 0, 12, TILE, '#141018'); R(c, 1, 1, 2, TILE - 2, '#a07840'); R(c, 9, 1, 2, TILE - 2, '#a07840');
    for (let y = 2; y < TILE; y += 5) { R(c, 2, y, 8, 2, '#c49a58'); R(c, 2, y, 8, 1, '#8a6a38'); }
  });
}

/* ---------- explosions & fx ---------- */
function explosionSprite(i) {
  return prop('exp' + i, 48, 48, (c) => {
    const PALETTES = [
      ['#ffffff', '#fff0a0', '#f8b030', '#e06020', '#8a3020', '#5a2018'],
      ['#ffffff', '#f0f0ff', '#c0a0f0', '#8050c0', '#402068', '#20103a'],
      ['#ffffff', '#fff0a0', '#f09030', '#a03020', '#601810', '#300c08'],
    ];
    const cols = PALETTES[i % 3];
    // three frames of one blast, shrinking and cooling
    const scale = [1, 0.78, 0.52][i];
    const R = 21 * scale;
    const ring = R * 0.34;              // how far the lobes sit from the centre
    const lobe = R * 0.56;
    const lobes = 9;
    c.save(); c.translate(24, 24);
    // distance field over the union of the lobes
    const field = new Float32Array(48 * 48);
    for (let py = 0; py < 48; py++) {
      for (let px = 0; px < 48; px++) {
        const dx = px - 24, dy = py - 24;
        let m = 0;
        for (let k = 0; k < lobes; k++) {
          const a = k / lobes * TAU + (k % 2 ? 0.42 : 0);
          const rr = lobe * (0.86 + ((k * 7) % 4) * 0.09);
          const ex = Math.cos(a) * ring, ey = Math.sin(a) * ring;
          const dd = Math.hypot(dx - ex, dy - ey);
          if (dd < rr) m = Math.max(m, 1 - dd / rr);
        }
        // plus a central core so the ball is solid, not a ring of blobs
        const dc = Math.hypot(dx, dy);
        if (dc < lobe * 0.9) m = Math.max(m, 1 - dc / (lobe * 0.9));
        field[py * 48 + px] = m;
      }
    }
    // cols[5] is the dark outer shell (largest area, lowest m), cols[0] the
    // white-hot core (smallest area, highest m)
    const cuts = [0.9, 0.8, 0.7, 0.58, 0.45, 0.3];
    for (let bi = cols.length - 1; bi >= 0; bi--) {
      c.fillStyle = cols[bi];
      const cut = cuts[bi];
      for (let py = 0; py < 48; py++) {
        for (let px = 0; px < 48; px++) {
          const m = field[py * 48 + px];
          if (m >= cut) c.fillRect(px - 24, py - 24, 1, 1);
        }
      }
    }
    c.restore();
  });
}

  /* --- helpers --- */
  zoneOf(x) { return ZONES[this.zoneAt ? this.zoneAt[clamp(x, 0, this.W - 1) | 0] : 0] || ZONES[0]; },
  prop(x, y, kind, opts) { this.props.push(Object.assign({ x: x * TILE, y: y * TILE, kind, z: this.zoneAt ? this.zoneAt[clamp(x, 0, this.W - 1) | 0] : 0 }, opts || {})); },
  platform(x, y, w, kind) { this.setT; for (let i = 0; i < w; i++) this.grid[y * this.W + x + i] = T_PLAT; this.props.push({ x: x * TILE, y: y * TILE, kind: '_plat', plat: true, h: w }); },
  ladder(x, y) { this.grid[y * this.W + x] = T_LADDER; },
  building(x, w, h, groundRow, style) {
    // solid block with interior, roof platform, balconies, windows
    const W = this.W;
    const top = groundRow - h;
    for (let yy = top; yy < groundRow; yy++) for (let xx = x; xx < x + w; xx++) this.grid[yy * W + xx] = T_SOLID;
    // carve interior
    for (let yy = top + 2; yy < groundRow - 1; yy++) for (let xx = x + 2; xx < x + w - 2; xx++) this.grid[yy * W + xx] = T_EMPTY;
    // door on ground floor
    for (let yy = groundRow - 2; yy < groundRow; yy++) for (let xx = x + 4; xx < x + 7; xx++) this.grid[yy * W + xx] = T_EMPTY;
    // Street-level passage through both walls, with a continuous floor.
    for (let xx = x; xx < x + w; xx++) {
      for (let yy = groundRow - 3; yy < groundRow; yy++) this.grid[yy * W + xx] = T_EMPTY;
      for (let yy = groundRow; yy < this.H; yy++) this.grid[yy * W + xx] = T_SOLID;
      this.groundY[xx] = groundRow;
    }
    // roof
    for (let xx = x; xx < x + w; xx++) this.grid[top * W + xx] = T_PLAT;
    this.props.push({ x: x * TILE, y: top * TILE, kind: 'roof', w: w * TILE, z: this.zoneAt[clamp(x, 0, this.W - 1) | 0] });
    // interior floors (one-way platforms)
    for (let f = top + 3; f < groundRow - 2; f += 3) {
      for (let xx = x + 2; xx < x + w - 2; xx++) this.grid[f * W + xx] = T_PLAT;
      this.props.push({ x: (x + 2) * TILE, y: f * TILE, kind: '_plat', plat: true, h: (w - 4) * TILE });
    }
    // facade decorations
    for (let yy = top + 1; yy < groundRow - 1; yy++) {
      for (let xx = x + 2; xx < x + w - 2; xx++) {
        if (this.grid[yy * W + xx] === T_PLAT) continue;
        if (hash2(xx, yy) > 0.86) this.props.push({ x: xx * TILE, y: yy * TILE, kind: 'window', z: this.zoneAt[clamp(xx, 0, this.W - 1) | 0] });
      }
    }
    if (w > 12) this.props.push({ x: (x + 1) * TILE, y: (top + 4) * TILE, kind: 'balcony', z: this.zoneAt[clamp(x, 0, this.W - 1) | 0] });
    // ladder inside
    const lx = x + 2;
    for (let yy = top; yy < groundRow; yy++) this.grid[yy * W + lx] = T_LADDER;
    this.props.push({ x: lx * TILE, y: top * TILE, kind: 'ladder', h: (groundRow - top) * TILE, z: this.zoneAt[clamp(x, 0, this.W - 1) | 0] });
  },
  secretBox(x, y, w, h, mat) {
    // A hollow chamber buried in the terrain. Its 3-tile-tall mouth on the
    // left is plugged with destructible crates, so the only way in is to
    // blast your way through - the entrance is deliberately too tall to
    // simply walk over, so the player can never be stuck.
    const W = this.W;

    for (let yy = y + 1; yy < y + h - 1; yy++) this.grid[yy * W + x + w - 1] = T_EMPTY;

  captive(x, y, opts) {

  },
  pickup(x, y, kind) {
    this.pickups.push({ kind, x: x * TILE + 1, y: (y + 1) * TILE - 14, t: 0, taken: false, crate: kind.indexOf('crate_') === 0 });
  },
  tileAt(x, y) {

  solidAt(x, y) { const t = this.tileAt(x, y); return t === T_SOLID || t === T_SPIKE; },
  platAt(x, y) { return this.tileAt(x, y) === T_PLAT; },
  groundYAt(x) { return this.groundY[clamp(Math.floor(x / TILE), 0, this.W - 1)] * TILE; },
  zoneAtPx(x) { return ZONES[this.zoneAt[clamp(Math.floor(x / TILE), 0, this.W - 1) | 0]] || ZONES[0]; },

/* ============================================================

const BG = {
  draw(c, camX, camY, t) {
    const z = Level.zoneAtPx(camX + VW / 2);
    const sky = c.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, z.sky[0]); sky.addColorStop(0.55, z.sky[1]); sky.addColorStop(1, z.sky[2]);
    c.fillStyle = sky; c.fillRect(0, 0, VW, VH);
    if (z.type === 'desert') this.sun(c, camX, camY, t, z);
    if (z.type === 'canyon') this.glowworms(c, camX, camY, t);
    if (z.type === 'arena') this.fireGlow(c, camX, camY, t, z);
    if (z.type === 'canyon') {
      this.canyonWalls(c, camX, camY, z, t);
    } else {
      // far range, mid range, near range (bases low enough to leave sky visible)
      this.mountains(c, camX, camY, z, 0.10, z.far, 118, 26, 46, 1.2);
      if (z.type === 'village') this.cityline(c, camX, camY, z, 0.18, z.far, 138, 46, t);
      if (z.type === 'arena') this.fortress(c, camX, camY, t, z);
      this.mountains(c, camX, camY, z, 0.22, z.mid, 168, 30, 34, 2.4);
      this.mountains(c, camX, camY, z, 0.40, z.near, 206, 22, 24, 3.6);
      this.groundBand(c, camX, camY, z);
    }
  },
  sun(c, camX, camY, t, z) {
    const x = VW * 0.72 - camX * 0.03, y = 44 - camY * 0.1;
    const g = c.createRadialGradient(x, y, 2, x, y, 70);
    g.addColorStop(0, 'rgba(255,246,200,0.95)');
    g.addColorStop(0.25, 'rgba(255,210,120,0.55)');
    g.addColorStop(1, 'rgba(255,180,90,0)');
    c.fillStyle = g; c.fillRect(x - 80, y - 80, 160, 160);
    c.fillStyle = 'rgba(255,248,210,0.9)';
    c.beginPath(); c.arc(x, y, 17, 0, TAU); c.fill();
  },
  mountains(c, camX, camY, z, par, col, base, amp, freq, depth) {
    c.fillStyle = col;
    const y0 = base - camY * par * 0.5;
    const bottom = VH + 40;
    c.beginPath(); c.moveTo(0, bottom);
    for (let sx = -20; sx <= VW + 20; sx += 6) {
      const wx = (camX * par + sx) / freq;
      let h = 0;
      h += Math.sin(wx) * amp * 0.5;
      h += Math.sin(wx * 2.3 + 1.7) * amp * 0.28;
      h += Math.sin(wx * 5.1 + 3.1) * amp * 0.14;
      h += (hash2(Math.floor(wx * 3), 7) - 0.5) * amp * 0.3;
      c.lineTo(sx, y0 - h);
    }
    c.lineTo(VW, bottom); c.closePath(); c.fill();
    // sunlit rim along the ridge
    c.save();
    c.globalAlpha = 0.16;
    c.fillStyle = '#ffffff';
    c.beginPath();
    for (let sx = -20; sx <= VW + 20; sx += 6) {
      const wx = (camX * par + sx) / freq;
      let h = 0;
      h += Math.sin(wx) * amp * 0.5;
      h += Math.sin(wx * 2.3 + 1.7) * amp * 0.28;
      h += Math.sin(wx * 5.1 + 3.1) * amp * 0.14;
      h += (hash2(Math.floor(wx * 3), 7) - 0.5) * amp * 0.3;
      if (sx === -20) c.moveTo(sx, y0 - h);
      else c.lineTo(sx, y0 - h);
    }
    for (let sx = VW + 20; sx >= -20; sx -= 6) {
      const wx = (camX * par + sx) / freq;
      let h = 0;
      h += Math.sin(wx) * amp * 0.5;
      h += Math.sin(wx * 2.3 + 1.7) * amp * 0.28;
      h += Math.sin(wx * 5.1 + 3.1) * amp * 0.14;
      h += (hash2(Math.floor(wx * 3), 7) - 0.5) * amp * 0.3;
      c.lineTo(sx, y0 - h + 2);
    }
    c.closePath(); c.fill();
    c.restore();
  },
  canyonWalls(c, camX, camY, z, t) {
    // back wall with strata
    c.fillStyle = '#1e1626';
    c.fillRect(0, 0, VW, VH);
    for (let band = 0; band < 7; band++) {
      c.fillStyle = band % 2 ? '#241a2e' : '#1a1222';
      c.fillRect(0, band * 40 - (camY * 0.25) % 40, VW, 20);
    }
    // distant rock columns (parallax 0.4)
    for (let i = 0; i < 26; i++) {
      const wx = i * 67 + 900;
      let x = wx - camX * 0.4;
      x = ((x % (VW + 400)) + (VW + 400)) % (VW + 400) - 100;
      const w = 26 + hash2(i, 3) * 34;
      const h = 60 + hash2(i, 9) * 150;
      c.fillStyle = '#2c2038';
      c.fillRect(x, 30 - camY * 0.2, w, h);
      c.fillStyle = '#191122';
      c.fillRect(x, 30 - camY * 0.2 + h - 10, w, 10);
    }
    // ceiling stalactites hugging the top of the frame
    c.fillStyle = '#241a30';
    for (let i = 0; i < 22; i++) {
      const wx = i * 37 + 400;
      let x = wx - camX * 0.92;
      x = ((x % (VW + 90)) + (VW + 90)) % (VW + 90) - 30;
      const len = 10 + hash2(i, 5) * 30;
      const w = 5 + hash2(i, 11) * 8;
      c.beginPath();
      c.moveTo(x - w, -10); c.lineTo(x + w, -10); c.lineTo(x, len);
      c.closePath(); c.fill();
    }
    // corridor side walls: fixed to the frame, jitter keyed to world position
    const w = 26;
    for (const side of [0, 1]) {
      const seg = Math.floor(camX / 24);
      c.fillStyle = side ? '#241a2c' : '#241a2c';
      c.beginPath();
      const base = side ? VW : 0;
      const dir = side ? -1 : 1;
      c.moveTo(base, 0);
      for (let i = 0; i <= 9; i++) {
        const yy = i / 9 * VH;
        const j = (hash2(seg * 9 + i, side * 31) - 0.5) * 14 + Math.sin(camX * 0.05 + i) * 3;
        c.lineTo(base + dir * (w + j), yy);
      }
      c.lineTo(base, VH); c.closePath(); c.fill();
      c.fillStyle = '#160f1c';
      c.beginPath();
      c.moveTo(base, 0);
      for (let i = 0; i <= 9; i++) {
        const yy = i / 9 * VH;
        const j = (hash2(seg * 9 + i, side * 31) - 0.5) * 14 + Math.sin(camX * 0.05 + i) * 3;
        c.lineTo(base + dir * (w + j - 9), yy);
      }
      c.lineTo(base, VH); c.closePath(); c.fill();
    }
  },
  cityline(c, camX, camY, z, par, col, base, amp, t) {
    for (let sx = -20; sx <= VW + 20; sx += 6) {
      const wx = (camX * par + sx);
      const i = Math.floor(wx / 26);
      const h = 18 + hash2(i, 5) * amp;
      const w = 22 + hash2(i, 9) * 12;
      c.fillStyle = col;
      c.fillRect(sx, base - h - camY * par * 0.4, w, h + 80);
      c.fillStyle = 'rgba(0,0,0,0.18)';
      c.fillRect(sx + w - 4, base - h - camY * par * 0.4, 4, h + 80);
      if (hash2(i, 13) > 0.7) { c.fillStyle = col; c.fillRect(sx + w * 0.4, base - h - 12 - camY * par * 0.4, 3, 12); }
    }
  },
  fortress(c, camX, camY, t, z) {
    const par = 0.3;
    const bx = -camX * par;
    c.fillStyle = '#2a0e12';
    for (let i = 0; i < 5; i++) {
      const x = bx + i * 300 - 100;
      c.fillRect(x, 40, 90, 200);
      for (let m = 0; m < 4; m++) c.fillRect(x - 6, 44 + m * 8, 102, 6);
      c.fillStyle = 'rgba(240,120,40,0.14)';
      c.fillRect(x + 10, 70, 10, 14); c.fillRect(x + 50, 110, 10, 14);
      c.fillStyle = '#2a0e12';

    c.fillStyle = '#1a070a';

  },
  glowworms(c, camX, camY, t) {
    for (let i = 0; i < 26; i++) {
      const wx = (i * 137 + Math.sin(t * 0.4 + i) * 30);
      let x = (wx - camX * 0.4) % (VW + 60); if (x < 0) x += VW + 60;
      const y = 20 + hash2(i, 3) * 120 + Math.sin(t * 1.3 + i * 2) * 6 - camY * 0.3;
      const a = 0.35 + 0.35 * Math.sin(t * 2 + i);
      c.fillStyle = 'rgba(140,255,180,' + a.toFixed(2) + ')';
      c.fillRect(x | 0, y | 0, 2, 2);
    }
  },
  fireGlow(c, camX, camY, t, z) {
    const g = c.createLinearGradient(0, VH * 0.4, 0, VH);
    g.addColorStop(0, 'rgba(200,60,20,0)');
    g.addColorStop(1, 'rgba(220,90,30,0.35)');
    c.fillStyle = g; c.fillRect(0, VH * 0.4, VW, VH * 0.6);
    for (let i = 0; i < 6; i++) {
      const x = ((i * 160 - camX * 0.22) % (VW + 200) + VW + 200) % (VW + 200) - 100;
      const a = 0.10 + 0.06 * Math.sin(t * 3 + i);
      c.fillStyle = 'rgba(255,160,60,' + a.toFixed(2) + ')';
      c.fillRect(x, 190, 120, 40);
    }
  },
  groundBand(c, camX, camY, z) {
    // distant plateau just behind the playable ground, for depth
    const gy = Level.groundYAt(camX + VW / 2);
    const y = Math.max(gy - 30, 150) - camY * 0.72;
    c.fillStyle = mix(z.near, '#1a1018', 0.35);
    c.beginPath();
    c.moveTo(0, VH);
    for (let sx = 0; sx <= VW + 10; sx += 10) {
      const wx = (camX * 0.72 + sx) / 60;
      c.lineTo(sx, y - Math.sin(wx) * 5 - hash2(Math.floor(wx), 3) * 8);
    }
    c.lineTo(VW, VH); c.closePath(); c.fill();
  },
  /* foreground haze drawn after entities */
  fore(c, camX, camY, t) {
    const z = Level.zoneAtPx(camX + VW / 2);
    if (z.type === 'canyon') {
      // dark rock frame at the very front of the corridor
      c.save();
      c.fillStyle = '#100a18';
      for (const side of [0, 1]) {
        const x = side ? VW - 14 : -2;
        c.beginPath();
        c.moveTo(x, 0);
        c.lineTo(x + 16, 0);
        for (let i = 0; i <= 8; i++) {
          c.lineTo(x + (side ? 16 - hash2(i + Math.floor(camX * 0.4) * 3, 2) * 10 : hash2(i + Math.floor(camX * 0.4) * 3, 2) * 10), i / 8 * VH);
        }
        c.lineTo(x, VH); c.closePath(); c.fill();
      }
      c.restore();
      return;
    }
    const col = z.type === 'arena' ? '#140608' : '#2a1a12';
    const gy = Level.groundYAt(camX + VW / 2) - camY;
    // foreground silhouette band at the very bottom of the screen
    c.save();
    c.globalAlpha = 0.9;
    c.fillStyle = col;
    c.beginPath();
    c.moveTo(0, VH);
    for (let sx = 0; sx <= VW + 8; sx += 8) {
      const wx = (camX * 1.3 + sx) / 46;
      const h = Math.sin(wx) * 3 + Math.sin(wx * 2.7) * 2 + hash2(Math.floor(wx), 21) * 5;
      c.lineTo(sx, Math.max(gy + 14, VH - 26) + h);
    }
    c.lineTo(VW, VH); c.closePath(); c.fill();
    // swaying grass / rubble tufts sitting on that band
    for (let sx = -10; sx <= VW + 10; sx += 11) {
      const wx = Math.floor((camX * 1.3 + sx) / 46);
      if (hash2(wx, 21) < 0.55) continue;
      const bx = sx, by = Math.max(gy + 14, VH - 26) + Math.sin(wx) * 3;
      const sway = Math.sin(t * 2.2 + wx) * 2;
      c.beginPath();
      c.moveTo(bx - 4, by + 4);
      c.quadraticCurveTo(bx - 2 + sway, by - 10, bx + sway, by - 15);
      c.quadraticCurveTo(bx + 1 + sway, by - 9, bx + 4, by + 4);
      c.closePath(); c.fill();
    }
    c.restore();
  },
};

/* ============================================================
   07 - PARTICLES & FEEDBACK FX
   ============================================================ */
const Particles = [];
const Texts = [];
const MAXP = 900;

class Particle {

  init(o) {
    this.x = o.x; this.y = o.y; this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.g = o.g === undefined ? 0 : o.g;

    this.kind = o.kind || 'spark';
    this.col = o.col || '#ffffff';
    this.col2 = o.col2 || null;
    this.size = o.size || 2;
    this.rot = o.rot || 0; this.vr = o.vr || 0;
    this.fade = o.fade !== false;
    this.drag = o.drag || 0;
    this.bounce = o.bounce || 0;
    this.glow = o.glow || false;
    this.sprite = o.sprite || null;
    this.scale = o.scale || 1;
    this.dead = false;
    return this;
  }
  update(dt, world) {
    this.t += dt;
    if (this.t >= this.life) { this.dead = true; return; }
    this.vy += this.g * dt;
    if (this.drag) { const d = Math.pow(1 - this.drag, dt * 60); this.vx *= d; this.vy *= d; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.vr * dt;
    if (this.bounce && world) {
      const gy = world.groundBelow(this.x, this.y);
      if (gy !== null && this.y > gy && this.vy > 0) { this.y = gy; this.vy = -this.vy * 0.42; this.vx *= 0.7; }
    }
  }
  draw(c) {
    const k = this.t / this.life;
    const a = this.fade ? clamp(1 - k * k, 0, 1) : 1;
    c.save();
    c.globalAlpha = a;
    switch (this.kind) {
      case 'smoke': {
        const s = this.size * (0.5 + k * 0.85);
        c.fillStyle = this.col;
        c.globalAlpha = a * 0.85;
        c.beginPath(); c.arc(this.x, this.y, s, 0, TAU); c.fill();
        c.beginPath(); c.arc(this.x - s * 0.25, this.y - s * 0.3, s * 0.6, 0, TAU); c.fill();
        c.beginPath(); c.arc(this.x + s * 0.3, this.y + s * 0.2, s * 0.5, 0, TAU); c.fill();
        break;
      }
      case 'ring': {
        c.strokeStyle = this.col; c.lineWidth = Math.max(0.6, 3 * (1 - k));
        c.beginPath(); c.arc(this.x, this.y, this.size * (0.3 + k * 2.2), 0, TAU); c.stroke();
        break;
      }
      case 'shockring': {
        // flat, ground-hugging dust ring - reads as pressure, not a magic circle
        c.strokeStyle = this.col;
        c.lineWidth = Math.max(0.8, 4 * (1 - k));
        c.beginPath();
        c.ellipse(this.x, this.y, this.size * (0.3 + k * 2.4), this.size * (0.12 + k * 0.4), 0, 0, TAU);
        c.stroke();
        break;
      }
      case 'spark': {
        c.fillStyle = this.col;
        const L = this.size * (1 - k * 0.5);
        c.fillRect(this.x - L / 2, this.y - 0.5, L, 1.2);
        c.fillStyle = this.col2 || '#ffffff';
        c.fillRect(this.x - 0.5, this.y - 0.5, 1.2, 1.2);
        break;
      }
      case 'debris': {
        c.translate(this.x, this.y); c.rotate(this.rot);
        c.fillStyle = this.col;
        c.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        c.fillStyle = this.col2 || 'rgba(0,0,0,0.3)';
        c.fillRect(-this.size / 2, this.size / 2 - 1, this.size, 1);
        break;
      }
      case 'shell': case 'cas': {
        c.translate(this.x, this.y); c.rotate(this.rot);
        c.fillStyle = this.col; c.fillRect(-1.5, -1, 3, 2);
        c.fillStyle = '#f0e090'; c.fillRect(-1.5, -1, 3, 1);
        break;
      }
      case 'goo': {
        c.fillStyle = this.col;
        c.beginPath(); c.arc(this.x, this.y, this.size * (1 - k * 0.4), 0, TAU); c.fill();
        break;
      }
      case 'flame': {
        // soft additive puff that cools from white-hot to deep red
        const s = this.size * (1.15 - k * 0.55);

        const hot = this.col, cool = this.col2 || '#701808';

        g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(this.x, this.y, s, 0, TAU); c.fill();
        break;
      }
      case 'text': {
        c.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
        text(c, this.txt, this.x, this.y - k * 12, this.col, this.size >= 2 ? 1 : 1, 'c');
        break;
      }
      case 'flash': {
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = a;
        c.fillStyle = this.col;
        c.beginPath(); c.arc(this.x, this.y, this.size * (1 + k * 1.4), 0, TAU); c.fill();
        break;
      }
      case 'blast': {
        const spr = this.sprite || explosionSprite(0);

        const grow = 1 + (1 - a) * 0.18;
        const w = spr.width * this.scale * grow, h = spr.height * this.scale * grow;
        c.translate(this.x, this.y); c.rotate(this.rot);
        c.drawImage(spr, -w / 2, -h / 2, w, h);
        break;
      }
      case 'trail': {
        c.globalAlpha = a * 0.6;
        c.fillStyle = this.col;

const _pool = [];
function emit(o) {
  let p;
  if (Particles.length < MAXP) { p = _pool.pop() || new Particle(); Particles.push(p); }
  else { p = Particles[(Math.random() * Particles.length) | 0]; }
  p.init(o);
  return p;
}
function updateParticles(dt, world) {
  for (let i = Particles.length - 1; i >= 0; i--) {
    const p = Particles[i];
    p.update(dt, world);
    if (p.dead) { Particles.splice(i, 1); _pool.push(p); }
  }
  for (let i = Texts.length - 1; i >= 0; i--) {
    const t = Texts[i];
    t.t += dt; t.y += t.vy * dt; t.vy += 40 * dt;
    if (t.t > t.life) Texts.splice(i, 1);
  }
}
function drawParticles(c) {
  for (let i = 0; i < Particles.length; i++) Particles[i].draw(c);
  for (let i = 0; i < Texts.length; i++) {
    const t = Texts[i];
    text(c, t.txt, t.x, t.y, t.col, 1, 'c');
  }
}

/* --- composite effects --- */
const FX = {
  shake(a) { G.shake = Math.min(14, Math.max(G.shake, a)); },

  hit(x, y, col, n) {

  blood(x, y, col, n) {

  dust(x, y, n, col) {

    for (let i = 0; i < n; i++) {

  },
  shell(x, y, dir) {
    emit({ x, y, vx: -dir * rnd(20, 60), vy: rnd(-90, -40), g: 700, life: 0.7, kind: 'shell', col: '#e0c060', rot: rnd(0, 6), vr: rnd(-14, 14), bounce: 1 });
  },
  smokeTrail(x, y, col, size) {
    emit({ x: x + rnd(-1, 1), y: y + rnd(-1, 1), vx: rnd(-8, 8), vy: rnd(-14, -4), life: rnd(0.4, 0.8), kind: 'smoke', col: col || 'rgba(120,120,130,0.55)', size: size || 2.5 });
  },
  fireTrail(x, y) {
    emit({ x, y, vx: rnd(-14, 14), vy: rnd(-18, 6), life: rnd(0.16, 0.34), kind: 'flame', col: '#f8d040', col2: '#d03a10', size: rnd(2, 4) });
    if (chance(0.5)) emit({ x, y, vx: rnd(-10, 10), vy: rnd(-24, -6), life: rnd(0.3, 0.6), kind: 'smoke', col: 'rgba(60,55,55,0.5)', size: rnd(2, 4) });
  },
  explosion(x, y, power, col) {
    power = power || 1;
    const n = Math.round(9 * power);
    emit({ x, y, life: 0.26, kind: 'flash', col: 'rgba(255,240,200,0.95)', size: 10 * power, glow: true });
    emit({ x, y, life: 0.3, kind: 'shockring', col: 'rgba(255,225,170,0.75)', size: 9 * power });
    // a few big hot puffs, many small sparks

      emit({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, g: 120, life: rnd(0.2, 0.4) * power, kind: 'flame', col: '#fff0a0', col2: '#c03a10', size: rnd(7, 12) * power, drag: 0.05 });
    }
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(60, 240) * power;
      emit({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 300, life: rnd(0.15, 0.35) * power, kind: 'spark', col: '#ffe8a0', size: rnd(2, 5) * power, drag: 0.02 });
    }
    for (let i = 0; i < Math.round(6 * power); i++) {
      const a = rnd(0, TAU), s = rnd(10, 70);
      emit({ x: x + rnd(-5, 5), y: y + rnd(-5, 5), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rnd(0.7, 1.4), kind: 'smoke', col: 'rgba(64,58,58,0.5)', size: rnd(2.5, 4.5) * power, drag: 0.02 });
    }
    for (let i = 0; i < Math.round(8 * power); i++) {
      const a = rnd(0, TAU), s = rnd(60, 260) * power;
      emit({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, g: 800, life: rnd(0.5, 1.1), kind: 'debris', col: '#5a5048', col2: '#2a2520', size: rnd(2, 4), rot: rnd(0, 6), vr: rnd(-12, 12), bounce: 1 });
    }
    for (let i = 0; i < Math.round(5 * power); i++) {
      const a = rnd(0, TAU), s = rnd(80, 300);
      emit({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 300, life: rnd(0.2, 0.45), kind: 'spark', col: '#fff0a0', size: rnd(3, 7) });
    }

  bigExplosion(x, y, power) {

  },
  /** three-frame expanding fireball used for grenades, rockets and barrels */
  fireball(x, y, power) {

    // translucent balls reads as mush, so keep it to a tight two-frame pop
    emit({ x, y, life: 0.1, kind: 'blast', sprite: explosionSprite(0), scale: 0.95 * power, rot: rnd(-0.25, 0.25) });

  },
  muzzle(x, y, ang, big) {
    emit({ x, y, life: 0.05, kind: 'flash', col: 'rgba(255,240,190,0.9)', size: big ? 14 : 8, glow: true });
    for (let i = 0; i < (big ? 5 : 2); i++) {
      const a = ang + rnd(-0.3, 0.3);
      emit({ x, y, vx: Math.cos(a) * rnd(80, 200), vy: Math.sin(a) * rnd(80, 200), life: rnd(0.05, 0.14), kind: 'spark', col: '#fff0a0', size: rnd(2, 4) });
    }
  },
  bounceDust(x, y) { this.dust(x, y, 3); },
  hurtFlash() { this.shake(2.5); },
};

// Range is measured in world pixels (one screen = 480), independently of shot speed.
const WEAPONS = {
  pistol: { name: 'PISTOL', sfx: 'pistol', dmg: 2, range: 320, rate: 0.24, auto: true, speed: 360, ammo: Infinity, blt: 'pistol', kick: 18, shake: 0.5, muzzle: 1 },
  mg: { name: 'MACHINE GUN', sfx: 'mg', dmg: 1.25, range: 420, rate: 0.085, auto: true, speed: 460, ammo: 200, blt: 'mg', kick: 10, shake: 0.35, muzzle: 1, spread: 0.025 },
  shotgun: { name: 'SPREAD GUN', sfx: 'shotgun', dmg: 1.5, range: 180, falloffStart: 60, minDamage: 0.3, rate: 0.65, auto: false, speed: 380, ammo: 24, blt: 'shotgun', kick: 44, shake: 1.8, muzzle: 2, pellets: 7, spread: 0.18 },
  flame: { name: 'FLAMETHROWER', sfx: 'flame', dmg: 0.65, range: 100, rate: 0.065, auto: true, speed: 220, ammo: 180, blt: 'flame', kick: 3, shake: 0.15, muzzle: 0, flame: true, spread: 0.06 },
  rocket: { name: 'ROCKET LAUNCHER', sfx: 'rocket', dmg: 20, range: 640, rate: 0.9, auto: false, speed: 320, ammo: 8, blt: 'rocket', kick: 60, shake: 3, muzzle: 2, explode: 1.15, grav: 0, selfSafe: true },
  laser: { name: 'LASER RIFLE', sfx: 'laser', dmg: 5, range: 560, rate: 0.22, auto: true, speed: 480, ammo: 60, blt: 'laser', kick: 6, shake: 0.45, muzzle: 2, armorPiercing: true },
};
const WEAPON_KEYS = ['pistol', 'mg', 'shotgun', 'flame', 'rocket', 'laser'];

class Bullet {
  constructor(o) {

    this.r = o.r || 2; this.grav = o.grav || 0;
    this.explode = o.explode || 0; this.dead = false;
    this.rot = Math.atan2(this.vy, this.vx);
    this.pierce = o.pierce || 0; this.hitList = null;

  }
  update(dt, w) {
    if (this.dead) return;
    if (this.rangeEnded) { this.onEnd(w); return; }
    this.t += dt;
    if (this.t >= this.life) { this.onEnd(w); return; }
    this.sx = this.x; this.sy = this.y;
    this.vy += this.grav * dt;
    const dx = this.vx * dt, dy = this.vy * dt;
    const distance = Math.hypot(dx, dy);
    const movement = Math.min(distance, Math.max(0, this.range - this.travelled));
    const fraction = distance > 0 ? movement / distance : 0;
    this.x += dx * fraction; this.y += dy * fraction;
    this.travelled += movement;
    this.rangeEnded = this.travelled >= this.range;
    if (this.travelled > this.falloffStart) {
      const fade = clamp((this.travelled - this.falloffStart) / (this.range - this.falloffStart), 0, 1);

      if (chance(0.7)) FX.smokeTrail(this.x - Math.cos(this.rot) * 4, this.y - Math.sin(this.rot) * 4, 'rgba(200,200,210,0.5)', 2);

    }

    }

  onHitWall(w) {

    c.rotate(this.rot);
    if (this.flame) {
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.9;
    }
    c.drawImage(spr, -3, -4);
    c.restore();
  }
}

/* ---------- grenades ---------- */
class Grenade {
  constructor(x, y, vx, vy, own, fuse) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.own = own || 'p';
    this.fuse = fuse === undefined ? 1.5 : fuse;
    this.rot = 0; this.vr = 8;
    this.dead = false; this.bounces = 0;
    this.r = 4;
  }
  update(dt, w) {
    this.fuse -= dt;
    this.rot += this.vr * dt;
    this.vy += 620 * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    // tile bounce
    if (w.solidAt(this.x, this.y)) {
      // try axis separation
      const hitX = w.solidAt(this.x + Math.sign(this.vx) * 3, this.y - 1);
      const hitY = w.solidAt(this.x, this.y + Math.sign(this.vy) * 3);
      if (hitY) { this.y -= Math.sign(this.vy) * 3; this.vy = -this.vy * 0.42; this.vr = -this.vr * 0.6; SFX('bounce', { pitch: rnd(0.8, 1.3) }); }
      if (hitX) { this.x -= Math.sign(this.vx) * 3; this.vx = -this.vx * 0.45; }
      if (!hitX && !hitY) { this.vy = -this.vy * 0.4; this.y -= 1; }
      this.bounces++;
      if (this.vy < -60) { this.vx *= 0.8; }
    }
    if (w.solidAt(this.x, this.y - 1) && this.vy < 0) { this.y += 1; this.vy = Math.abs(this.vy) * 0.4; }
    if (this.fuse <= 0) this.boom(w);
    if (this.x < w.camX - 60 || this.x > w.camX + VW + 60) this.dead = true;
  }
  boom(w) {
    SFX('explode');
    FX.fireball(this.x, this.y, 1.15);
    FX.explosion(this.x, this.y, 1.1);
    w.explodeDamage(this.x, this.y, 95, 62, this.own);
    this.dead = true;
  }
  draw(c, camX, camY) {
    c.save();
    c.translate(this.x - camX, this.y - camY);
    c.rotate(this.rot);
    c.fillStyle = '#141018'; c.fillRect(-4, -4, 8, 8);
    c.fillStyle = '#3a5a3a'; c.fillRect(-3, -3, 6, 6);
    c.fillStyle = '#5a8a5a'; c.fillRect(-3, -3, 6, 2);
    c.fillStyle = '#8a8a92'; c.fillRect(-1, -6, 2, 3);
    const blink = (this.fuse < 0.6 && (G.time * 12 | 0) % 2) ? '#ff4030' : '#c8b070';
    c.fillStyle = blink; c.fillRect(1, -7, 2, 2);
    c.restore();
  }
}

/* ---------- laser sight line (sniper telegraph) ---------- */
class LaserLine {
  constructor(x, y, ang, t) { this.x = x; this.y = y; this.ang = ang; this.t = t; this.max = t; this.dead = false; this.fired = false; }
  update(dt, w) {
    if(this.dead)return;
    if(this.owner && this.owner.dead){this.dead=true;return;}
    this.length=460;
    for(let d=4;d<460;d+=4)if(w.solidAt(this.x+Math.cos(this.ang)*d,this.y+Math.sin(this.ang)*d)){this.length=d;break;}
    this.t -= dt;
    if (this.t <= 0) {
      this.dead = true;
      if (!this.fired) {
        this.fired=true;
        SFX('laser', { v: 0.9, pitch: 0.6 });
        const ex = this.x + Math.cos(this.ang) * (this.length || 460), ey = this.y + Math.sin(this.ang) * (this.length || 460);
        w.beamHit(this.x, this.y, ex, ey, 26, this.own || 'e');
        FX.hit(this.x + Math.cos(this.ang) * 6, this.y + Math.sin(this.ang) * 6, '#60f0f0', 8);
      }
    }
  }
  draw(c, camX, camY) {
    const a = 1 - Math.abs(this.t / this.max - 0.5) * 2;
    c.save();
    c.globalAlpha = 0.35 + 0.45 * a;
    c.strokeStyle = '#ff3020';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(this.x - camX, this.y - camY);
    c.lineTo(this.x - camX + Math.cos(this.ang) * (this.length || 460), this.y - camY + Math.sin(this.ang) * (this.length || 460));
    c.stroke();
    c.globalAlpha = 0.9;
    c.strokeStyle = '#ffffff';
    c.lineWidth = 1;
    c.stroke();
    c.restore();
  }
}

/* ============================================================
   09 - THE PLAYER: "BUNNY" the commando
   ============================================================ */
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 11; this.h = 22;
    this.vx = 0; this.vy = 0; this.face = 1;
    this.onGround = false; this.coyote = 0; this.jumpBuf = 0;
    this.hp = 4; this.maxHp = 4;
    this.state = 'normal';
    this.anim = 'idle'; this.frame = 0; this.animT = 0; this.animSpeed = 1;
    this.aim = 0; this.crouch = false;
    this.weapon = 'pistol'; this.ammo = { mg: 0, shotgun: 0, flame: 0, rocket: 0, laser: 0 };
    this.grenades = 6; this.maxGrenades = 99;
    this.fireT = 0; this.knifeT = 0; this.throwT = 0;
    this.invuln = 0; this.deadT = 0; this.hurtT = 0;
    this.shield = 0;
    this.stepT = 0; this.lastStep = 0;
    this.vehicle = null;
    this.respawnT = 0;
    this.winT = 0;
    this.hitFlash = 0;
    this.muzzle = 0;
    this.bandage = 0;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }
  get headY() { return this.y + 3; }

  reset(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.hp = this.maxHp; this.state = 'normal';
    this.h = 22; this.crouch = false; this.climbing = false; this.onGround = false;
    this.coyote = 0; this.jumpBuf = 0; this.vehicle = null;
    this.fireT = this.knifeT = this.throwT = this.animT = this.shield = 0;
    this.invuln = 1.2; this.deadT = 0; this.hurtT = 0;
    this.weapon = 'pistol'; this.anim = 'idle'; this.frame = 0;
    this.grenades = Math.max(this.grenades, 6);
  }

  update(dt, w) {
    if (this.state === 'dead') { this.deadT += dt; this.vy += 1200 * dt; this.y += this.vy * dt; this.animT += dt; return; }
    if (this.state === 'victory') { this.winT += dt; this.animT += dt; this.vx *= 0.8; return; }

    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 4);
    this.muzzle = Math.max(0, this.muzzle - dt);
    this.shield = Math.max(0, this.shield - dt);
    this.fireT -= dt; this.knifeT -= dt; this.throwT -= dt;

    const locked = w.inputLocked;
    const L = !locked && down('left'), R = !locked && down('right');
    const U = !locked && down('up'), D = !locked && down('down');
    const RUN = 112, ACC = 950, FRIC = 1400, AIR = 0.45;
    const nearLadder = this.inLadder(w);
    if (!nearLadder || L || R || hit('jump')) this.climbing = false;
    else if (U || D && !this.onGround) this.climbing = true;
    const crouching = D && this.onGround && !this.climbing;

    // --- horizontal ---
    let dir = 0;
    if (!this.climbing) {
      if (L) dir = -1; else if (R) dir = 1;
      const acc = (this.onGround ? ACC : ACC * AIR) * dt;
      if (dir !== 0) { this.vx += dir * acc; this.vx = clamp(this.vx, -RUN, RUN); this.face = dir; }
      else if (this.onGround) { const f = FRIC * dt; if (Math.abs(this.vx) <= f) this.vx = 0; else this.vx -= Math.sign(this.vx) * f; }
    }

    // --- jump with coyote + buffer ---
    this.coyote = this.onGround ? 0.1 : Math.max(0, this.coyote - dt);
    if (!locked && hit('jump')) this.jumpBuf = 0.13;
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    if (this.jumpBuf > 0 && this.coyote > 0) {
      this.vy = -400; this.onGround = false; this.coyote = 0; this.jumpBuf = 0;
      SFX('jump', { pitch: rnd(0.95, 1.08) });
      FX.dust(this.cx, this.feet, 4, 'rgba(210,190,150,0.5)');
    }
    this.vy += 1500 * dt;
    this.vy = Math.min(this.vy, 700);

    // --- ladders ---
    const onLad = this.climbing;
    if (onLad) {
      this.vy = U ? -95 : D ? 95 : 0;
      this.vx = 0;
      if (U || D) { this.x += 0; this.climbAnim = (this.climbAnim || 0) + dt; }
    }

    // --- crouch / aim ---
    this.crouch = crouching;
    const newH = crouching ? 15 : 22;
    if (newH <= this.h || !w.anySolid(this.x, this.feet - newH, this.x + this.w, this.feet)) {
      this.y += this.h - newH; this.h = newH;
    } else this.crouch = true;
    let aim = this.face > 0 ? 0 : Math.PI;
    if (U) {
      if (this.crouch) aim = -1.4;
      else if (dir !== 0) aim = dir > 0 ? -0.8 : -2.35;
      else aim = -Math.PI / 2;
    }
    if (D && !this.onGround) aim = Math.PI / 2;
    if (this.crouch) aim = this.face > 0 ? 0 : Math.PI;
    this.aim = aim;

    // --- weapons ---
    const wp = WEAPONS[this.weapon];
    const canFire = !locked;
    if (canFire && down('fire') && this.fireT <= 0) {
      if (wp.auto || hit('fire')) this.fire(w);
    }
    if (canFire && hit('grenade') && this.grenades > 0 && this.throwT <= 0) this.throwGrenade(w);
    if (canFire && hit('knife') && this.knifeT <= 0) this.knife(w);
    if (canFire && hit('special') && this.shield <= 0 && w.giveShield) w.giveShield(this);

    // --- movement resolve ---
    const prevY = this.y;
    this.moveX(this.vx * dt, w);
    if (onLad) { this.moveY(this.vy * dt, w); }
    else { this.moveY(this.vy * dt, w); }

    // --- footsteps & dust ---
    if (this.onGround && Math.abs(this.vx) > 40) {
      this.stepT += dt * Math.abs(this.vx) * 0.06;
      if (this.stepT > 1) {
        this.stepT = 0;
        SFX('step', { v: 0.5 });
        FX.dust(this.cx - this.face * 4, this.feet, 1);
      }
    }

    // --- vehicle entry ---
    if (w.vehicle && w.vehicle.active && !w.vehicle.ridden) {
      const d = dist2(this.cx, this.cy, w.vehicle.x + 22, w.vehicle.y - 10);
      if (d < 40 * 40) {
        w.showPrompt('PRESS ' + 'UP' + ' TO BOARD', this.cx, this.y - 34);
        if (!locked && hit('up')) w.enterVehicle();
      }
    }

    this.updateAnim(dt);
  }

  updateAnim(dt) {
    let a = 'idle';
    if (this.hurtT > 0) a = 'hurt';
    else if (this.knifeT > 0) a = 'knife';
    else if (this.throwT > 0) a = 'throw';
    else if (!this.onGround) a = this.vy < 0 ? 'jump' : 'fall';
    else if (this.crouch) a = (Math.abs(this.vx) > 20) ? 'crouchwalk' : 'crouch';
    else if (Math.abs(this.vx) > 22) a = 'run';
    if (this.anim !== a) this.animT = 0;
    this.anim = a;
    this.animT += dt;
    const def = ANIMS[a];
    const fps = def[2];
    this.frame = Math.floor(this.animT * fps * (a === 'knife' ? 3 / def[1] : 1)) % def[1];
    if (a === 'knife') this.frame = clamp(Math.floor(this.knifeProgress * 3), 0, 2);
  }
  get knifeProgress() { return 1 - Math.max(0, this.knifeT) / 0.22; }
  get throwProgress() { return 1 - Math.max(0, this.throwT) / 0.28; }

  moveX(dx, w) {
    const steps = Math.max(1, Math.ceil(Math.abs(dx)));
    const step = dx / steps;
    for (let i = 0; i < steps; i++) {
      const nx = this.x + step;
      if (!w.anySolid(nx, this.y + 0.01, nx + this.w, this.feet)) {
        this.x = nx;
        continue;
      }
      // Walk up a single terrain tile, but never through a ceiling.
      let climbed = false;
      if (this.onGround) for (let rise = 1; rise <= TILE; rise++) {
        if (!w.anySolid(nx, this.y - rise, nx + this.w, this.feet - rise) &&
            !w.anySolid(this.x, this.y - rise, this.x + this.w, this.feet - rise)) {
          this.x = nx; this.y -= rise; climbed = true; break;
        }
      }
      if (!climbed) { this.vx = 0; break; }
    }
    this.x = clamp(this.x, 0, Level.W * TILE - this.w);
  }
  moveY(dy, w) {
    const wasGround = this.onGround;
    this.onGround = false;
    const steps = Math.max(1, Math.ceil(Math.abs(dy)));
    const step = dy / steps;
    for (let i = 0; i < steps; i++) {
      const ny = this.y + step;
      const landing = step >= 0 ? w.platformTop(this.x + 0.01, this.x + this.w - 0.01,
        this.feet, ny + this.h) : null;
      if (landing !== null) {
        this.y = landing - this.h; this.onGround = true; this.vy = 0; break;
      }
      if (w.anySolid(this.x + 0.01, ny, this.x + this.w - 0.01, ny + this.h)) {
        // Binary refinement keeps feet exactly on the surface, without jitter.
        let lo = 0, hi = 1;
        for (let j = 0; j < 16; j++) {
          const mid = (lo + hi) / 2, y = this.y + step * mid;
          if (w.anySolid(this.x + 0.01, y, this.x + this.w - 0.01, y + this.h)) hi = mid;
          else lo = mid;
        }
        this.y += step * lo;
        this.onGround = step >= 0; this.vy = 0; break;
      }
      this.y = ny;
    }
    if (this.onGround && !wasGround) { SFX('land', { v: 0.5 }); FX.dust(this.cx, this.feet, 4); }
    this.clampToWorld();
  }
  clampToWorld() {
    if (this.y > Level.H * TILE + 40) { this.die(null); }
  }
  checkLand() { }

  inLadder(w) {
    return w.onLadder(this.x + 2, this.y + this.h - 4) || w.onLadder(this.x + this.w - 2, this.y + this.h - 4);
  }

  muzzlePos() {
    const cy = this.crouch ? this.y + 5 : this.y + 10;
    return [this.cx + Math.cos(this.aim) * 17, cy + Math.sin(this.aim) * 13];
  }

  fire(w) {
    const wp = WEAPONS[this.weapon];
    if (wp.ammo !== Infinity && this.ammo[this.weapon] !== undefined) {
      if (this.ammo[this.weapon] <= 0) {
        this.weapon = 'pistol';
        SFX('blip');
        return;
      }
      this.ammo[this.weapon]--;
    }
    this.fireT = wp.rate;
    this.muzzle = 0.06;
    const [mx, my] = this.muzzlePos();
    const ang = this.aim;
    const n = wp.pellets || 1;
    for (let i = 0; i < n; i++) {
      let a = ang;
      if (wp.spread) a += n > 1 ? lerp(-wp.spread, wp.spread, i / (n - 1)) : rnd(-wp.spread, wp.spread);
      const sp = wp.speed;
      w.bullets.push(new Bullet({
        x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        dmg: wp.dmg, range: wp.range, life: wp.range / sp + STEP * 2,
        falloffStart: wp.falloffStart, minDamage: wp.minDamage, armorPiercing: wp.armorPiercing, own: 'p', kind: wp.blt, grav: wp.grav || 0, explode: wp.explode || 0, flame: wp.flame, r: wp.explode ? 3 : 2,
      }));
    }
    SFX(wp.sfx, { v: 0.9 });
    if (wp.kick) this.vx -= Math.cos(ang) * wp.kick * 0.16 * (this.onGround ? 1 : 0.3);
    if (wp.shake) FX.shake(wp.shake);
    FX.muzzle(mx, my, ang, wp.muzzle > 1);
    if (this.weapon !== 'flame') FX.shell(mx - Math.cos(ang) * 2, my - Math.sin(ang) * 2, this.face);
    // muzzle light
    emit({ x: mx, y: my, life: 0.07, kind: 'flash', col: 'rgba(255,230,160,0.5)', size: 7 });
    if (this.aim > 1.0) FX.dust(this.cx, this.y + this.h, 2);
  }

  throwGrenade(w) {
    if (this.grenades <= 0) { SFX('blip'); return; }
    this.grenades--;
    this.throwT = 0.28;
    const a = this.aim === 0 ? this.face * 0.5 : this.aim;
    const sp = 250;
    const gx = this.cx + Math.cos(a) * 8, gy = this.y + 6 + (this.aim < -1 ? -2 : 0);
    w.grenades.push(new Grenade(gx, gy, Math.cos(a) * sp, Math.sin(a) * sp - (this.aim === 0 ? 160 : 60), 'p', 1.5));
    SFX('thrown');
  }

  knife(w) {
    this.knifeT = 0.22;
    SFX('knife');
    const dir = this.face;
    const hx = this.cx + dir * 8, hy = this.crouch ? this.y + 8 : this.y + 12;
    w.knifeHit(hx, hy, dir, 20, 34);
  }

  damage(n, w, srcX) {
    if (this.invuln > 0 || this.state !== 'normal') return;
    if (this.shield > 0) {
      this.shield = 0;
      this.invuln = 0.8; this.hitFlash = 1;
      SFX('clank'); FX.hit(this.cx, this.cy, '#60f0f0', 14);
      FX.popup(this.cx, this.y - 6, 'SHIELD!', '#60f0f0');
      return;
    }
    this.hp -= n;
    this.invuln = 1.1;
    this.hurtT = 0.22;
    this.hitFlash = 1;
    SFX('hurt');
    FX.hurtFlash();
    FX.blood(this.cx, this.cy, '#c03a3a', 6);
    if (srcX !== undefined && srcX !== null) this.vx += sign(this.cx - srcX) * 70;
    if (this.hp <= 0) this.die(w);
  }

  die(w) {
    if (this.state === 'dead') return;
    this.state = 'dead';
    this.deadT = 0;
    this.hp = 0;
    this.vy = -260; this.vx = -sign(this.vx || 1) * 40;
    SFX('playerDie');
    FX.shake(4);
  }

  draw(c, camX, camY) {
    if (this.state === 'normal' && this.invuln > 0 && (G.time * 22 | 0) % 2) return;
    const gun = (this.anim === 'knife' || this.anim === 'throw') ? 'none' : this.weapon;
    let opt = {};
    let pal = 'hero';
    if (this.state === 'dead' || this.deadT > 0) {
      const k = clamp(this.deadT / 0.7, 0, 1);
      const spr = fighterFrame('hero', 'dead', Math.min(3, Math.floor(k * 4)), 'none', { rot: -k * 1.5, sq: k * 0.4 });
      c.save(); c.globalAlpha = 1;
      c.drawImage(spr, Math.round(this.cx - camX - spr.width / 2), Math.round(this.y - camY + this.h - (spr.height - 4) + k * 2), spr.width, spr.height);
      c.restore();
      return;
    }
    if (this.state === 'victory') {
      const spr = fighterFrame('hero', 'victory', this.frame, 'none');
      drawSpr(c, spr, this.cx - camX, this.feet - camY, this.face, 0);
      return;
    }
    const spr = fighterFrame(pal, this.anim, this.frame, gun, { aim: this.face > 0 ? this.aim : Math.PI - this.aim });
    const flash = this.hitFlash > 0 ? this.hitFlash : (this.invuln > 0 ? 0.35 : 0);
    drawSpr(c, spr, this.cx - camX, this.feet - camY, this.face, flash);
    // muzzle flash
    if (this.muzzle > 0) {
      const [mx, my] = this.muzzlePos();
      const spr2 = WEAPONS[this.weapon].muzzle > 1 ? muzzleFlashBig() : muzzleFlash();
      c.save();
      c.translate(Math.round(mx - camX), Math.round(my - camY));
      c.rotate(this.aim);
      c.globalAlpha = clamp(this.muzzle / 0.06, 0, 1);
      c.drawImage(spr2, 0, -spr2.height / 2);
      c.restore();
    }
  }
}

const ETYPE = {
  soldier: { hp: 3, score: 100, w: 11, h: 22, speed: 74, pal: 'soldier', gun: 'mg' },

  sniper: { hp: 3, score: 220, w: 11, h: 22, speed: 40, pal: 'sniper', gun: 'pistol' },
  heavy: { hp: 12, score: 350, w: 15, h: 24, speed: 34, pal: 'heavy', gun: 'mg' },
  drone: { hp: 4, score: 250, w: 30, h: 16, speed: 92, pal: 'bossDark', gun: 'none', fly: true },
  turret: { hp: 6, score: 200, w: 24, h: 20, speed: 0, pal: 'bossDark', gun: 'ebolt', static: true },
  emplacement: { hp: 10, score: 300, w: 30, h: 22, speed: 0, pal: 'bossDark', gun: 'spread', static: true },
